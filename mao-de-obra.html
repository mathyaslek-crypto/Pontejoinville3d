<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="sync.js?v=1" data-keys="alya-terc-peso-v1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>Mão de obra · Ponte Joinville</title>
<!-- V1.81 — Mão de obra (saiu do Dashboard do 3D). Lê os pacotes da Pasta do RDO e mostra o efetivo por dia, por
     função, por encarregado e por atividade. Sem horas-homem: só pessoas e diárias (1 pessoa num dia = 1 diária). -->
<style>
:root{--bg:#0e141a;--panel:#141c24;--raise:#1a242e;--line:#22303b;--line2:#304150;--ink:#e8edf2;--ink2:#c3ccd5;--muted:#8a99a8;--amber:#f2b33d;
 --f:Bahnschrift,"DIN Alternate","Segoe UI Variable Text","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0b1117f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .mk{width:30px;height:30px;background:var(--amber);clip-path:polygon(50% 0,100% 100%,72% 100%,50% 52%,28% 100%,0 100%)}
header h1{font-size:17px;margin:0;font-weight:600}
header small{display:block;color:var(--muted);font-size:12px;font-weight:400}
header .sp{flex:1}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:#d3dbe3;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;text-decoration:none}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:transparent;color:#b8c4cf;padding:0 13px;min-height:38px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--amber);color:#18140a;font-weight:600}
.per{display:flex;gap:6px;align-items:center}
.per button{width:38px;min-height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;font-size:18px}
input[type=date],input[type=month],select{min-height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);padding:0 10px;color-scheme:dark}
select{max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;min-width:0}
.card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 span{letter-spacing:0;text-transform:none;font-weight:400}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi .v{font-size:30px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:3px}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.two{grid-template-columns:1fr 1.3fr}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);text-transform:none;letter-spacing:0;font-weight:400}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend button{border:0;background:none;color:inherit;cursor:pointer;padding:2px 0;font-size:12.5px}
.legend button[aria-pressed=false]{opacity:.38}
svg.chart{width:100%;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f)}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:crosshair}
svg.chart .sel{fill:#f2b33d14;stroke:#f2b33d55}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0b1117;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 10px 24px #0009;min-width:160px;display:none}
#tip b{display:block;margin-bottom:3px}
#tip div{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip div span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
#tip div i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#18212a;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#17212b}
.tw{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.mx tbody tr{cursor:pointer}
.mx tbody tr.on td{background:#2a241255}
.mx td.c{text-align:center;font-variant-numeric:tabular-nums}
.mx td.c span{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px}
.mx td.z{color:#3b4a58}
.sub2{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;background:#22303d;color:var(--ink2);white-space:nowrap}
.pill.e{background:#2a2412;color:#f6dc9a}
.hb{display:grid;gap:9px}
.hr{display:grid;grid-template-columns:minmax(0,40%) 1fr 110px;gap:10px;align-items:center;font-size:13px}
.hr .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hr .t{height:12px;background:#1b2530;border-radius:4px;overflow:hidden}
.hr .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hr .v{text-align:right;font-variant-numeric:tabular-nums}
.hr .v small{color:var(--muted);margin-left:4px}
.det{margin-top:14px}
.det h3{margin:0 0 4px;font-size:16px}
.dd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#111920}
.dd .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.dd .h b{font-size:13.5px}
.dd .fs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dd details{margin-top:6px;font-size:12.5px;color:var(--ink2)}
.dd summary{cursor:pointer;color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.note{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2631;border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:14px;display:none;z-index:60;max-width:calc(100% - 24px)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:24px}header{padding:10px 12px}.card{padding:14px 12px}.hr{grid-template-columns:minmax(0,38%) 1fr 92px}}
</style>
</head>
<body>
<header><a class="btn ghost" href="./" title="Voltar ao início" style="padding:0 10px">←</a><div class="mk"></div><div><h1>Mão de obra · Ponte Joinville</h1><small id="sub">Efetivo dos RDOs enviados pelos apontadores</small></div><div class="sp"></div>
 <button class="btn" id="upd">Atualizar</button></header>
<main id="app"><div class="empty"><b>Lendo a Pasta do RDO…</b></div></main>
<div id="tip"></div><div id="toast"></div>
<script>
'use strict';
// (V1.86) a mesma página mostra os terceiros com ?terceiros (aba Terceiros do início): equipes das empresas terceiras e o cadastro
const TERC=/[?&]terceiros\b/.test(location.search);
const EMPS=[['SPT','S.Pontes'],['BML','BML'],['BSM','BSM'],['BRG','Berg Mineração']],empName=k=>(EMPS.find(e=>e[0]===k)||[])[1]||k||'';
const KEY=TERC?'alya-terc-v2':'alya-mo-v1',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
const br=d=>d?d.split('-').reverse().join('/'):'—';
const brs=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const wd=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const iso=x=>{let d=new Date(x);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const addD=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const today=()=>iso(Date.now());
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const monLabel=m=>MES[+m.slice(5,7)-1]+' de '+m.slice(0,4);
const hm=m=>{m=Math.round(m);let h=Math.floor(m/60)%24;return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const hmEnd=m=>m>=1440&&m%1440===0?'24:00':hm(m);
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4200);}

// ---------- mesmas regras do RDO (rdo.html) ----------
const SMALL=new Set(['da','de','do','das','dos','e']);
const title=s=>String(s||'').toLowerCase().split(/\s+/).map((w,i)=>/^(i|ii|iii|iv)$/.test(w)?w.toUpperCase():i&&SMALL.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const short=s=>{let w=String(s||'').split(/\s+/).filter(Boolean);return title(w[0]+(w.length>1?' '+w[w.length-1]:''));};
const dow=d=>new Date(d+'T12:00:00').getDay();
function win(d,s){let w=dow(d),he=w===6||w===0;if(s==='noite')return w>=1&&w<=4?{a:1080,b:1640}:{a:w===5||w===6?900:1020,b:1440};return w>=1&&w<=4?{a:420,b:1020}:{a:420,b:960};}
function lado(f){f=String(f||'');return /adhemar/i.test(f)?'Adhemar':/boa\s*vista/i.test(f)?'Boa Vista':'';}
// grupos de função dos gráficos (os mesmos que o 3D usava)
const FN=[{k:'Encarregado',c:'#3987e5',re:/encarreg|lider|mestre|feitor/},{k:'Carpinteiro',c:'#d95926',re:/carpint/},{k:'Pedreiro',c:'#199e70',re:/pedreir/},
 {k:'Ajudante',c:'#c98500',re:/ajudant|servent/},{k:'Armador',c:'#d55181',re:/armador|ferreir/},{k:'Outras funções',c:'#9085e9',re:/./}];
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const grp=r=>{const n=norm(r);for(const f of FN)if(f.re.test(n))return f.k;return 'Outras funções';};
const FC=Object.fromEntries(FN.map(f=>[f.k,f.c]));

// ---------- leitura de um pacote do RDO ----------
// Cada dia/apontador/turno guarda: equipes (encarregado + quantidades) e atividades com as pessoas distribuídas
// como no RDO (a mesma pessoa não conta duas vezes em horários diferentes). O pacote mais novo de cada dia vale.
function readDay(o,d,x){
 const author=x.author||o.from||'?',shift=x.shift==='noite'?'noite':'dia',key=d+'|'+author+'|'+shift,w=win(d,shift);
 const rowsMO=(o.maoDeObra||[]).filter(r=>r.data===d&&(r.apontador||'')===(x.author||'')&&(r.turno||'dia')===shift);
 const cargo=new Map;for(const r of rowsMO)if(r.encarregado&&r.cargo)cargo.set(norm(r.encarregado),r.cargo);
 const crewById=new Map,crews=[];
 for(const c of (TERC?x.tcrews:x.crews)||[]){const n=title(c.fid),cg=TERC?'Encarregado':cargo.get(norm(n))||'Encarregado',counts={};
  for(const [f,v] of Object.entries(c.counts||{}))if(+v)counts[title(f)]=(counts[title(f)]||0)+(+v);
  const cr={id:c.id,enc:n,cargo:cg,emp:TERC?empName(c.emp):'',pres:TERC?(c.pres||[]).map(q=>({m:q.m,n:q.n,f:q.f})):undefined,counts,total:1+Object.values(counts).reduce((s,v)=>s+v,0)};crews.push(cr);crewById.set(c.id,{raw:c,cr});}
 // atividades na mesma ordem do RDO (listActs) para casar com as linhas de "atividades" do pacote
 const evs=(o.events||[]).filter(e=>!e.deleted&&e.date===d).sort((a,b)=>(a.sm??0)-(b.sm??0)||String(a.created).localeCompare(String(b.created)));
 let acts=evs.map(e=>({kind:'3d',label:e.piece||e.uid||'Peça',sub:e.service||'',status:e.status||'',sm:e.sm??w.a,em:e.em??w.b,crews:e.crews||[],terc:!!e.terc}))
  .concat((x.extras||[]).map(t=>({kind:'extra',label:t.desc||'Atividade extra',sub:'Atividade extra',status:'Extra',sm:t.sm,em:t.em,crews:t.crews||[],terc:!!t.terc})));
 acts=acts.map((a,i)=>({...a,i})).sort((p,q)=>p.sm-q.sm||p.em-q.em||p.i-q.i);
 const rowsA=(o.atividades||[]).filter(r=>r.data===d&&(r.apontador||'')===(x.author||'')&&(r.turno||'dia')===shift);
 if(rowsA.length===acts.length)acts.forEach((a,i)=>{const r=rowsA[i];a.label=r.atividade||a.label;if(r.tipo==='3D'){a.sub=r.servico||a.sub;a.status=r.situacao||a.status;}});
 acts=acts.filter(a=>a.terc===TERC);   // Alya e terceiros separados (V1.86)
 // distribui as pessoas (assign do RDO)
 const pools=new Map,out=[];
 for(const a of acts){const ps=[];
  for(const c of a.crews){const k=crewById.get(c.id);if(!k)continue;const {raw,cr}=k;
   const need=[['__L',1],...Object.entries(raw.counts||{}).map(([f,n])=>[f,Math.min(+n||0,c.counts&&c.counts[f]!=null?+c.counts[f]:+n||0)])];
   for(const [f,n] of need){if(!n)continue;const pk=raw.id+'|'+f,pool=pools.get(pk)||[];pools.set(pk,pool);let got=0;
    const mk=i=>f==='__L'?{nome:cr.enc,funcao:cr.cargo,enc:cr.enc}:{nome:short(cr.enc)+' · '+title(f)+' '+(i+1),funcao:title(f),enc:cr.enc};
    for(let i=0;i<pool.length&&got<n;i++)if(pool[i].every(([s,e])=>a.em<=s||a.sm>=e)){pool[i].push([a.sm,a.em]);ps.push(mk(i));got++;}
    while(got<n){pool.push([[a.sm,a.em]]);ps.push(mk(pool.length-1));got++;}}}
  out.push({tipo:a.kind==='3d'?'3D':'Extra',atividade:a.label,servico:a.kind==='3d'?a.sub:'',situacao:a.kind==='3d'?a.status:'',sm:a.sm,em:a.em,
   encs:[...new Set(a.crews.map(c=>crewById.get(c.id)).filter(Boolean).map(k=>k.cr.enc))],emps:[...new Set(a.crews.map(c=>crewById.get(c.id)).filter(Boolean).map(k=>k.cr.emp))],pessoas:ps});}
 return {key,data:d,apontador:x.author||o.from||'',turno:shift,frente:x.front||'',lado:lado(x.front)||lado(x.pluv==='boavista'?'Boa Vista':x.pluv==='adhemar'?'Adhemar':''),crews,acts:out};}

let db={days:{},at:{},files:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days)db=Object.assign({days:{},at:{},files:{}},s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
function importPkg(o,at){let n=0;
 for(const [d,x] of Object.entries(o.days||{})){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!x)continue;
  const key=d+'|'+(x.author||o.from||'?')+'|'+(x.shift==='noite'?'noite':'dia');
  if(String(db.at[key]||'')>at)continue;
  try{const r=readDay(o,d,x);if(r.crews.length||r.acts.length)db.days[key]=r;else delete db.days[key];db.at[key]=at;n++;}catch(e){console.error('mão de obra: dia',d,e);}}
 return n;}

let busy=false;
async function siteScan(manual){if(busy||location.protocol==='file:')return;busy=true;$('upd').disabled=true;let n=0,err='';
 try{const r=await fetch('/api/rdo/lista',{cache:'no-store'});
  if(!r.ok||!/json/.test(r.headers.get('content-type')||''))err='Não consegui ler a Pasta do RDO.';
  else{const L=((await r.json()).itens||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
   for(const e of L)for(const f of (e.arquivos||[])){if(f.kind!=='pacote')continue;const k=e.id+':'+f.n;if(db.files[k])continue;
    try{const q=await fetch('/api/rdo/arquivo/'+encodeURIComponent(e.id)+'/'+f.n,{cache:'no-store'});if(!q.ok)continue;const o=JSON.parse(await q.text());db.files[k]=1;
     if(o&&o.schema==='alya-rdo-pacote-1'){importPkg(o,o.exported||e.at||'');n++;}}catch(x){db.files[k]=1;}}}
 }catch(e){err='Sem conexão com o site.';}
 busy=false;$('upd').disabled=false;if(n)save();render();
 if(err&&manual)toast(err);else if(manual)toast(n?n+(n>1?' RDOs novos lidos':' RDO novo lido'):'Nenhum RDO novo na pasta.');else if(n)toast(n+(n>1?' RDOs novos':' RDO novo')+' da Pasta do RDO');}
$('upd').onclick=()=>siteScan(true);

// ---------- filtros ----------
let st={per:'mes',dia:'',mes:'',lado:'todos',turno:'todos',emp:'todos',act:'',fnOff:[]};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY+'-ui')||'{}'));}catch(e){}
const saveUI=()=>{try{localStorage.setItem(KEY+'-ui',JSON.stringify(st));}catch(e){}};
const allDays=()=>Object.values(db.days);
function base(){let L=allDays().filter(r=>(st.lado==='todos'||r.lado===st.lado)&&(st.turno==='todos'||r.turno===st.turno));
 if(TERC&&st.emp!=='todos')L=L.map(r=>({...r,crews:r.crews.filter(c=>c.emp===st.emp),acts:r.acts.filter(a=>(a.emps||[]).includes(st.emp))})).filter(r=>r.crews.length||r.acts.length);return L;}
function lastDate(){const ds=allDays().map(r=>r.data).sort();return ds.at(-1)||today();}
function range(){const last=lastDate();
 if(st.per==='dia'){const d=st.dia||last;return [d,d];}
 if(st.per==='mes'){const m=st.mes||last.slice(0,7);const e=addD((m.slice(5)==='12'?(+m.slice(0,4)+1)+'-01':m.slice(0,5)+String(+m.slice(5)+1).padStart(2,'0'))+'-01',-1);return [m+'-01',e];}
 if(st.per==='30')return [addD(last,-29),last];
 const ds=allDays().map(r=>r.data).sort();return [ds[0]||last,last];}
function inRange(rs,a,b){return rs.filter(r=>r.data>=a&&r.data<=b);}

// ---------- agregados ----------
function perDay(rs){const m=new Map;for(const r of rs){let g=m.get(r.data);if(!g){g={data:r.data,tot:0,f:{},rdos:0};m.set(r.data,g);}g.rdos++;
 for(const c of r.crews){g.tot+=c.total;g.f.Encarregado=(g.f.Encarregado||0)+1;for(const [f,n] of Object.entries(c.counts)){const k=grp(f);g.f[k]=(g.f[k]||0)+n;}}}return m;}
function series(rs,a,b){const m=perDay(rs),out=[];let days=Math.round((new Date(b)-new Date(a))/864e5)+1;
 if(days>120){const mm=new Map;for(const g of m.values()){const k=g.data.slice(0,7);let x=mm.get(k);if(!x){x={data:k,month:true,tot:0,f:{},n:0};mm.set(k,x);}x.n++;x.tot+=g.tot;for(const [f,v] of Object.entries(g.f))x.f[f]=(x.f[f]||0)+v;}
  return [...mm.values()].sort((p,q)=>p.data.localeCompare(q.data));}
 for(let d=a;d<=b;d=addD(d,1))out.push(m.get(d)||{data:d,tot:0,f:{},none:true});return out;}
function byRole(rs){const m=new Map;for(const r of rs)for(const c of r.crews){const add=(f,n)=>{let g=m.get(f)||{k:f,n:0,days:new Set,max:new Map};g.n+=n;g.days.add(r.data);g.max.set(r.data,(g.max.get(r.data)||0)+n);m.set(f,g);};add(c.cargo,1);for(const [f,n] of Object.entries(c.counts))add(f,n);}

function byForeman(rs){const m=new Map;for(const r of rs)for(const c of r.crews){let g=m.get(c.enc);if(!g){g={enc:c.enc,cargo:c.cargo,n:0,days:new Set,f:{},lados:new Set};m.set(c.enc,g);}

  ${aco?`<div class="bar" style="margin:12px 0 0;gap:14px"><span class="note" style="margin:0"><b style="color:var(--ink)">Capacidade de produção no mês: ${kg(cap)} kg</b> (${(cap/1000).toLocaleString('pt-BR',{maximumFractionDigits:2})} t)</span>
   <label class="note" style="display:flex;align-items:center;gap:8px;margin:0">Peso padrão por colaborador/dia <input type="number" min="0" step="0.1" id="pdef" value="${+(+pdb.def).toFixed(1)}" style="width:90px;min-height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);padding:0 8px"> kg</label>
   <button class="btn" type="button" id="preset" style="min-height:34px">Usar o padrão em todos os dias do mês</button></div>
  <p class="note" style="margin:8px 0 0">Cada dia já vem com o peso padrão. Mudou um dia, só ele muda (fica em amarelo).</p>`:''}`;};
 el.innerHTML=`<div class="card" style="margin-top:14px"><h2>Presença dos colaboradores · ${esc(MES[m-1])} de ${y}<span class="per" style="display:inline-flex;gap:6px"><button type="button" data-mx="-1" aria-label="Mês anterior">‹</button><button type="button" data-mx="1" aria-label="Próximo mês">›</button></span></h2>
  ${L.length?emps.map(tabela).join('')+'<p class="note" style="margin:10px 0 0">1 = veio trabalhar no dia (pela equipe lançada no RDO; quem faltou o apontador desmarca). Encarregados não entram na lista.</p>'
  :`<p class="note">Nenhum colaborador de terceiros lançado em ${esc(MES[m-1])} de ${y}. As equipes lançadas no RDO (3T · Terceiros do dia) aparecem aqui, uma linha por colaborador.</p>`}</div>`;
 el.querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{let yy=y,mm=m+(+b.dataset.mx);if(mm<1){mm=12;yy--;}if(mm>12){mm=1;yy++;}mxMes=yy+'-'+String(mm).padStart(2,'0');drawMx();});
 el.querySelectorAll('[data-pd]').forEach(i=>i.onchange=()=>{const o=pesoDb(),v=i.value===''?null:Math.max(0,+i.value);if(v==null||v===+o.def)delete o.d[i.dataset.pd];else o.d[i.dataset.pd]=v;pesoSave(o);setTimeout(drawMx,0);});
 const pd=$('pdef');if(pd)pd.onchange=()=>{const o=pesoDb();o.def=Math.max(0,+pd.value||0);pesoSave(o);setTimeout(drawMx,0);};
 const pr=$('preset');if(pr)pr.onclick=()=>{const o=pesoDb();for(const d of dias)delete o.d[d];pesoSave(o);drawMx();};}
if(TERC){const ms=document.createElement('style');ms.textContent=`.mxp{max-height:none}.mxp table{font-size:12px;border-collapse:separate;border-spacing:0}
.mxp th,.mxp td{padding:5px 6px;white-space:nowrap}.mxp th.dc,.mxp td.dc{text-align:center;min-width:34px}.mxp th.dc small{display:block;font-weight:400;font-size:10px;text-transform:lowercase}
.mxp th.dom{color:#5d6873}.mxp .nm{position:sticky;left:0;background:var(--panel);z-index:1;min-width:190px;max-width:240px;overflow:hidden;text-overflow:ellipsis}.mxp thead .nm{background:#18212a;z-index:3}
.mxp .nm small{display:block;color:var(--muted);font-size:10.5px}.mxp td.v{background:#1f7a5233;color:#8ee0b5;font-weight:700}.mxp td.z{color:#3b4a58}
.mxp tfoot td{border-top:1px solid var(--line2);background:#18212a}.mxp tfoot .nm{background:#18212a}.mxp tr.pw input{width:52px;min-height:28px;border-radius:6px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);text-align:center;font:inherit;font-size:11.5px;padding:0 2px;-moz-appearance:textfield}
.mxp tr.pw input.ov{border-color:var(--amber);color:#ffd27a}.mxp tr.pw input::-webkit-inner-spin-button{display:none}.mxh{font-size:14px;margin:16px 0 8px;display:flex;gap:10px;align-items:baseline}.mxh:first-of-type{margin-top:4px}.mxh span{color:var(--muted);font-size:12px;font-weight:400}.per button{width:30px;min-height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;color:var(--ink2)}`;document.head.appendChild(ms);
 addEventListener('storage',e=>{if(e.key===PKEY)drawMx();});}
// ---------- cadastro de terceiros (só na aba Terceiros) ----------
let CAD=null,cadQ='',cadDesl=false;
function loadCad(){return fetch('/api/rdo/terceiros',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.p){CAD=j.p;drawCad();}}).catch(()=>{});}
function drawCad(){const el=$('cad');if(!el)return;
 if(!CAD){el.innerHTML='<div class="card" style="margin-top:14px"><h2>Cadastro de terceiros</h2><p class="note">Carregando…</p></div>';return;}
 const all=Object.values(CAD),q=norm(cadQ),emp=st.emp==='todos'?null:(EMPS.find(e=>e[1]===st.emp)||[])[0];
 const ok=p=>(!emp||p.emp===emp)&&(cadDesl?p.ativo===false:p.ativo!==false)&&(!q||norm(p.nome+' '+p.m+' '+p.funcao).includes(q));
 const isL=p=>!!p.lider||/ENCARREG/.test(p.funcao||''),encs=all.filter(p=>isL(p)&&(!emp||p.emp===emp)),byEnc=new Map;
 for(const p of all.filter(ok)){const k=isL(p)?p.m:(p.enc||'');if(!byEnc.has(k))byEnc.set(k,[]);byEnc.get(k).push(p);}
 const ativos=all.filter(p=>p.ativo!==false&&(!emp||p.emp===emp)),fn={};for(const p of ativos)fn[title(p.funcao)]=(fn[title(p.funcao)]||0)+1;
 const grupos=[...encs.map(e=>e.m),''].filter(k=>byEnc.has(k)).map(k=>{const E=CAD[k],L=byEnc.get(k).sort((a,b)=>(isL(a)?-1:0)-(isL(b)?-1:0)||String(a.funcao).localeCompare(b.funcao)||String(a.nome).localeCompare(b.nome));
  return `<details class="cg" ${q?'open':''}><summary><b>${E?esc(title(E.nome)):'Sem encarregado'}</b><span>${E?esc(empName(E.emp))+' · turno '+(E.turno==='noite'?'da noite':'do dia')+' · ':''}${L.length} pessoa${L.length===1?'':'s'}</span></summary><div class="tw"><table><thead><tr><th>Matrícula</th><th>Nome</th><th>Função</th><th>Turno</th><th>Alterado</th></tr></thead><tbody>${L.map(p=>`<tr><td>${esc(p.m)}</td><td>${esc(title(p.nome))}</td><td>${esc(title(p.funcao))}</td><td>${p.turno==='noite'?'Noite':'Dia'}</td><td class="note">${p.alterado?br(p.alterado.slice(0,10)):''}</td></tr>`).join('')}</tbody></table></div></details>`;}).join('');
 el.innerHTML=`<div class="card" style="margin-top:14px"><h2>Cadastro de terceiros <span>${ativos.length} ativo${ativos.length===1?'':'s'} · ${Object.entries(fn).sort((a,b)=>b[1]-a[1]).map(([f,n])=>f+' '+n).join(' · ')||'nenhum'}</span></h2>
  <div class="bar" style="margin:0 0 10px"><input id="cq" type="search" placeholder="Buscar nome, matrícula ou função" value="${esc(cadQ)}" style="flex:1;min-width:200px;min-height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);padding:0 12px">${seg('desl',[['0','Ativos'],['1','Desligados']],cadDesl?'1':'0')}</div>
  ${grupos||'<p class="note">Ninguém encontrado. Os apontadores cadastram os colaboradores no RDO (3T · Terceiros do dia › Editar equipe).</p>'}
  <p class="note" style="margin:10px 0 0">A matrícula é criada automaticamente (sigla da empresa + número) e acompanha o colaborador mesmo se ele mudar de equipe ou turno.</p></div>`;
 const cq=$('cq');cq.oninput=()=>{cadQ=cq.value;const pos=cq.selectionStart;drawCad();const n=$('cq');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
 document.querySelectorAll('[data-desl]').forEach(b=>b.onclick=()=>{cadDesl=b.dataset.desl==='1';drawCad();});}
if(TERC){document.title='Terceiros · Ponte Joinville';const h=document.querySelector('header h1');if(h)h.textContent='Terceiros · Ponte Joinville';const sb=$('sub');if(sb)sb.textContent='Mão de obra das empresas terceiras';loadCad();$('upd').addEventListener('click',loadCad);
 const cs=document.createElement('style');cs.textContent='.cg{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#111920}.cg summary{cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.cg summary span{color:var(--muted);font-size:12.5px}.cg .tw{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px}';document.head.appendChild(cs);}
function bind(){
 document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{st.per=b.dataset.per;saveUI();render();});
 document.querySelectorAll('[data-lado]').forEach(b=>b.onclick=()=>{st.lado=b.dataset.lado;saveUI();render();});
 document.querySelectorAll('[data-turno]').forEach(b=>b.onclick=()=>{st.turno=b.dataset.turno;saveUI();render();});
 document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{st.emp=b.dataset.emp;saveUI();render();});
 document.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>{const k=b.dataset.fn;st.fnOff=st.fnOff.includes(k)?st.fnOff.filter(x=>x!==k):st.fnOff.concat(k);saveUI();render();});
 const fd=$('fd'),fm=$('fm');
 if(fd)fd.onchange=()=>{if(fd.value){st.dia=fd.value;saveUI();render();}};
 if(fm)fm.onchange=()=>{if(fm.value){st.mes=fm.value;saveUI();render();}};
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const n=+b.dataset.step,last=lastDate();
  if(st.per==='dia')st.dia=addD(st.dia||last,n);
  else{let [y,m]=(st.mes||last.slice(0,7)).split('-').map(Number);m+=n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}st.mes=y+'-'+String(m).padStart(2,'0');}
  saveUI();render();});
 document.querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>{st.per='dia';st.dia=r.dataset.day;saveUI();render();});
 document.querySelectorAll('tr[data-act]').forEach(r=>r.onclick=()=>{st.act=st.act===r.dataset.act?'':r.dataset.act;saveUI();render();if(st.act)setTimeout(()=>document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'nearest'}),30);});}

// dica ao passar o dedo/mouse
const tip=$('tip');
function showTip(el,x,y){let d;try{d=JSON.parse(el.dataset.tip);}catch(e){return;}
 tip.innerHTML=`<b>${esc(d.t)}</b>${(d.r||[]).map(([k,v,c])=>`<div><span>${c?`<i style="background:${c}"></i>`:''}${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}`;tip.style.display='block';
 const r=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x+14))+'px';tip.style.top=Math.max(8,Math.min(innerHeight-r.height-8,y-r.height-10))+'px';}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.style.display='none';});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.pointerType!=='mouse')showTip(el,e.clientX,e.clientY);});
addEventListener('scroll',()=>tip.style.display='none',{passive:true});

render();
setTimeout(()=>siteScan(false),300);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')siteScan(false);});
setInterval(()=>{if(document.visibilityState==='visible')siteScan(false);},5*60e3);
</script>
</body>
