<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">

<style>
:root{--bg:#0f161d;--panel:#151e27;--raise:#1b2631;--line:#24313d;--line2:#31404e;--ink:#e7ecf1;--muted:#8a99a8;--amber:#f2b33d;--green:#3fb37f;--red:#e0675c;--f:Bahnschrift,"DIN Alternate","Segoe UI Variable Text","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#0b1117f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top img{height:30px;border-radius:2px}
header.top .t{flex:1;min-width:0}
header.top strong{display:block;font-size:15px;font-weight:600}
header.top small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.sync.pending{background:#2a2412;border-color:#6b5520;color:#f6dc9a}
nav.tabs{display:flex;max-width:760px;margin:14px auto 0;padding:0 16px}
nav.tabs button{flex:1;min-height:42px;border:1px solid var(--line2);background:var(--raise);color:#b8c4cf;font-size:14px;cursor:pointer}
nav.tabs button+button{border-left:0}
nav.tabs button:first-child{border-radius:8px 0 0 8px}
nav.tabs button:last-child{border-radius:0 8px 8px 0}
nav.tabs button[aria-current=page]{background:var(--amber);color:#18140a;border-color:var(--amber);font-weight:600}
nav.tabs .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:#0003;font-size:11px}
main{max-width:760px;margin:0 auto;padding:14px 16px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:14px 0 8px;color:#dfe6ed}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font-size:16px}
input[type=date],input[type=time]{color-scheme:dark}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px #f2b33d26}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:#d3dbe3;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#18140a;font-weight:600}
.btn.go{background:var(--green);border-color:var(--green);color:#06150e;font-weight:600}
.btn.big{width:100%;min-height:56px;font-size:16.5px}
.btn.ghost{background:transparent}
.btn.danger{color:#f3a49c;border-color:#5a2f2c;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{flex:1;min-height:46px;padding:0 6px;border:0;background:transparent;color:#b8c4cf;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--amber);color:#18140a;font-weight:600}
.seg.status button[data-v="Concluído"][aria-pressed=true]{background:var(--green);color:#06150e}
.seg.status button[data-v="Paralisada"][aria-pressed=true]{background:var(--red);color:#1d0807}
/* Dia */
.day{display:flex;align-items:center;gap:10px}
.day .nav{width:46px;flex-shrink:0;padding:0;font-size:20px}
.day .d{flex:1;text-align:center;min-width:0}
.day .d b{display:block;font-size:18px;font-weight:600}
.day .d span{font-size:12.5px;color:var(--muted)}
.dayinfo{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#c9d3dc;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dayinfo span b{color:var(--muted);font-weight:400}
.final{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:#13281f;border:1px solid #2b6047;color:#a9e7c7;margin-bottom:12px}
.final div{flex:1;font-size:13.5px}
.final b{display:block;font-size:15px;color:#d8f5e6}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
/* Apontamentos */
.ev{display:grid;grid-template-columns:4px 1fr auto;gap:2px 12px;padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;text-align:left;width:100%;color:inherit}
.ev:hover{border-color:var(--line2)}
.ev i{grid-row:span 3;border-radius:2px;background:var(--amber)}
.ev i.Concluído{background:var(--green)}
.ev i.Paralisada{background:var(--red)}
.ev .p{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .st{font-size:12px;font-weight:600;white-space:nowrap;color:#f6dc9a}
.ev .st.Concluído{color:#8fdcb6}
.ev .st.Paralisada{color:#f3a49c}
.ev .s{font-size:13px;color:#c9d3dc;grid-column:2/-1}
.ev .m{font-size:12px;color:var(--muted);grid-column:2/-1}
.empty{color:var(--muted);font-size:14px;margin:6px 0 12px;text-align:center;padding:22px 10px;border:1px dashed var(--line2);border-radius:10px}
.fab{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:10;margin:4px 0 14px}
details.card{padding:0}
details.card>summary{padding:15px 16px;font-size:15px;font-weight:600;cursor:pointer}
details.card>div{padding:0 16px 16px}
.eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.eq small{font-size:11.5px;color:var(--muted)}
/* Passo a passo */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0b1117}
#sheet header .ttl{flex:1;min-width:0}
#sheet header b{display:block;font-size:15px}
#sheet header span{font-size:12px;color:var(--muted)}
#sheet .bar{height:3px;background:var(--line)}
#sheet .bar i{display:block;height:100%;background:var(--amber);transition:width .25s}
#sheet .body{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
#sheet footer{display:flex;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b1117;max-width:760px;width:100%;margin:0 auto}
#sheet footer .btn{flex:1}
.q{font-size:19px;font-weight:600;margin:2px 0 12px}
.picker{position:relative}
.picker svg{position:absolute;left:12px;top:23px;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.picker input{padding-left:38px}
.results{margin-top:8px;border:1px solid var(--line2);border-radius:10px;background:#141d26;overflow:hidden}
.results:empty{display:none}
.res{display:grid;grid-template-columns:96px 1fr;column-gap:10px;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer;color:inherit}
.res:first-child{border-top:0}
.res:hover,.res:focus,.res[aria-selected=true]{background:#22303d;outline:none}
.res .k{grid-row:span 2;font-size:11.5px;color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .l{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:#c6d0da;font-size:13.5px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chosen{padding:12px 14px;border-radius:10px;border:1px solid #6b5520;background:#211c10;margin-bottom:14px}
.chosen .ck{font-size:11.5px;color:var(--amber)}
.chosen .cl{font-size:16px;font-weight:600}
.chosen .ca{font-size:12.5px;color:#c9b98d}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;min-height:62px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);cursor:pointer;text-align:left}
.svc b{font-size:14.5px;font-weight:600}
.svc span{font-size:11.5px;color:var(--muted)}
.svc.done span{color:#7fd4ab}
.svc.open span,.svc.stop span{color:#f2c86a}
.svc[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);background:#2a2412}
.crew{display:grid;gap:6px}
.person{display:grid;grid-template-columns:28px 1fr 74px;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--raise)}
.person.off{opacity:.45}
.person input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--amber)}
.person .nm{min-width:0}
.person .nm b{display:block;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .nm span{font-size:11.5px;color:var(--muted)}
.person input.h{min-height:38px;padding:4px 8px;text-align:center;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.alert{font-size:13.5px;padding:10px 12px;border-radius:8px;background:#2a2412;border:1px solid #6b5520;color:#f6dc9a;margin:12px 0 0}
.alert.err{background:#2a1716;border-color:#7a3a35;color:#f3b4ad}
.sum{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.sum span{color:var(--muted)}
/* Equipes */
.team{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel)}
.team .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.team .hd input{font-weight:600}
.mrow{display:grid;grid-template-columns:1fr 132px 40px;gap:6px;margin-bottom:6px}
.mrow input,.mrow select{min-height:40px;font-size:14.5px;padding:6px 9px}
.mrow button{min-height:40px;padding:0;border-radius:8px;border:1px solid var(--line2);background:transparent;color:#f3a49c;cursor:pointer}
.days .drow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.days .drow:first-child{border-top:0}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#22303d;color:#c6d0da;white-space:nowrap}
.tag.ok{background:#13281f;color:#8fdcb6}
#notice{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;max-width:min(560px,calc(100% - 24px));background:#1b2631;border:1px solid var(--line2);border-radius:10px;padding:11px 15px;font-size:14px;box-shadow:0 12px 30px #0008;transition:.22s;pointer-events:none}
#notice.on{opacity:1;transform:translate(-50%,0)}
#notice.err{border-color:#7a3a35;background:#2a1716}
@media(max-width:720px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:6px 8px max(6px,env(safe-area-inset-bottom));background:#0b1117f5;border-top:1px solid var(--line);backdrop-filter:blur(8px)}
 nav.tabs button,nav.tabs button:first-child,nav.tabs button:last-child{border:0;border-radius:9px;background:transparent;font-size:13px;min-height:50px}
 nav.tabs button[aria-current=page]{background:#2a2412;color:var(--amber)}
 main{padding:12px 12px 120px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .eq{grid-template-columns:1fr}
 header.top .sync{display:none}
}
@media(min-width:721px){.fab{bottom:16px}}
@media(prefers-reduced-motion:reduce){#notice,#sheet .bar i{transition:none}}
</style>
</head>

function svcLabel(s){let m=String(s).match(/^(\d)a\s+(.+)$/i);if(m)return m[1]+'ª '+(SVC[m[2].toUpperCase()]||m[2]).toLowerCase();let e=String(s).match(/^(.+?)\s+(\d)A$/);if(e)return (SVC[e[1]]||e[1])+' · '+e[2]+'ª etapa';return SVC[s]||String(s).charAt(0)+String(s).slice(1).toLowerCase();}
const sideName=s=>s==='A'?'Adhemar':'Boa Vista';

// ---------- Dados e migração ----------
function blank(){return {schema:'alya-rdo-0.3',device:uid(),profile:'',teams:[],days:{},events:[],recent:[],catalog:null,sentAt:'',imports:[],lastTeam:''};}
const person=p=>typeof p==='string'?{name:p,role:''}:{name:String(p?.name||'').trim(),role:p?.role||''};
let db=blank(),migrated='';
try{
 let d=JSON.parse(localStorage.getItem(KEY));
 if(d&&d.schema==='alya-rdo-0.3')db=Object.assign(blank(),d);
 else{
  let o2=JSON.parse(localStorage.getItem(KEY02)),o1=JSON.parse(localStorage.getItem(KEY01));
  if(o2&&o2.schema==='alya-rdo-0.2'){db=Object.assign(blank(),o2,{schema:'alya-rdo-0.3'});db.teams=(o2.teams||[]).map(t=>({...t,people:(t.people||[]).map(person)}));db.events=(o2.events||[]).map(e=>({...e,workers:(e.workers||[]).map(n=>({...person(n),hours:hoursOf(e.startTime,e.endTime)}))}));migrated='Seus dados do RDO V0.2 foram trazidos: '+db.events.length+' apontamentos e '+db.teams.length+' equipes. Confira as funções de cada pessoa em Enviar › Equipes.';}
  else if(o1&&o1.schema==='alya-rdo-0.1'){db.teams=(o1.teams||[]).map(t=>({...t,people:(t.people||[]).map(person)}));db.profile=o1.profile||'';migrated='Equipes do beta 0.1 trazidas. Confira as funções em Enviar › Equipes.';}
 }
}catch(e){}
for(let [k,v] of Object.entries(db.days)){v.rain=v.rain||['','',''];v.equipment=v.equipment||{};v.revs=v.revs||[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){note('Não foi possível salvar no celular. Envie para o 3D agora para não perder.',true);return false}}
let catalog=CATALOG_SEED;if(db.catalog&&String(db.catalog.generated)>String(CATALOG_SEED.generated))catalog=db.catalog;
let pieceMap=new Map;function indexCatalog(){pieceMap=new Map(catalog.pieces.map(p=>[p.u,p]));for(let p of catalog.pieces)p.h=norm([p.l,p.k,p.a,p.b,p.u,sideName(p.s),p.t?'t'+p.t+' transicao':''].join(' '));}
indexCatalog();
let tab='Hoje',day=today();
const live=()=>db.events.filter(e=>!e.deleted);
const dayEvents=d=>live().filter(e=>e.date===d).sort((a,b)=>String(a.startTime||'99').localeCompare(String(b.startTime||'99'))||String(a.created).localeCompare(String(b.created)));
const unsent=()=>db.events.filter(e=>String(e.updated||e.created)>String(db.sentAt||'')).length;
function getDay(d=day){return db.days[d]??={author:db.profile,contract:'',area:'1',front:'',rain:['','',''],mm:'',notes:'',equipment:{},finalized:null,revs:[]};}
function note(t,err){let n=$('notice');n.textContent=t;n.classList.toggle('err',!!err);n.classList.add('on');clearTimeout(note.t);note.t=setTimeout(()=>n.classList.remove('on'),err?6000:3600);}
function hoursOf(a,b){if(!a||!b||b<=a)return 8;let [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number),h=(h2*60+m2-h1*60-m1)/60;if(h>=6)h-=1;return Math.round(h*2)/2;}
const count=s=>new Set(String(s||'').split(',').map(x=>x.trim()).filter(Boolean)).size;

function svcState(u,s){let p=pieceMap.get(u),[cs,ce]=p?.v?.[s]||['',''],evs=live().filter(e=>e.uid===u&&e.service===s).sort((a,b)=>a.date.localeCompare(b.date));
 if(isNA(cs)&&isNA(ce))return {k:'na'};let done=evs.filter(e=>e.status==='Concluído').at(-1)?.date||(ce&&!isNA(ce)?ce:''),start=evs[0]?.date||(cs&&!isNA(cs)?cs:'');
 if(done)return {k:'done',d:done};if(start){let last=evs.at(-1);return {k:last?.status==='Paralisada'?'stop':'open',d:start,last};}return {k:'todo'};}
const services=u=>{let p=pieceMap.get(u);return p?Object.keys(p.v).filter(s=>svcState(u,s).k!=='na'):[]};
const mins=t=>{let [h,m]=String(t||'').split(':').map(Number);return h*60+(m||0)};
function dayHours(list){let sum=list.reduce((s,x)=>s+x.h,0),iv=list.filter(x=>x.a&&x.b&&x.b>x.a).map(x=>[mins(x.a),mins(x.b)]).sort((a,b)=>a[0]-b[0]);if(iv.length<list.length)return Math.min(sum,24);let tot=0,cs=-1,ce=-1;for(let [a,b] of iv){if(a>ce){if(ce>cs)tot+=ce-cs;cs=a;ce=b;}else ce=Math.max(ce,b);}if(ce>cs)tot+=ce-cs;let span=tot/60;if(span>=6)span-=1;return Math.min(sum,Math.round(span*2)/2);}
function dayStats(d){let evs=dayEvents(d),people=new Map;for(let e of evs)for(let w of e.workers||[]){let k=norm(w.name);let x=people.get(k)||{name:w.name,role:w.role,hours:0,list:[],teams:new Set,acts:0};x.list.push({h:+w.hours||0,a:e.startTime,b:e.endTime});x.acts++;if(e.teamName)x.teams.add(e.teamName);if(!x.role&&w.role)x.role=w.role;people.set(k,x);}
 for(let x of people.values())x.hours=dayHours(x.list);
 let c=evs.reduce((s,e)=>s+(e.concrete||0),0),a=evs.reduce((s,e)=>s+(e.steel||0),0),hh=[...people.values()].reduce((s,p)=>s+p.hours,0);return {evs,people:[...people.values()],concrete:c,steel:a,hh};}

// ---------- Estrutura ----------
function openGroups(){let m=new Map;for(let e of live()){let k=e.uid+'|'+e.service;if(!m.has(k))m.set(k,[]);m.get(k).push(e);}
 return [...m.values()].map(evs=>{evs.sort((a,b)=>a.date.localeCompare(b.date)||String(a.created).localeCompare(String(b.created)));return {uid:evs[0].uid,service:evs[0].service,start:evs[0].date,last:evs.at(-1),done:evs.some(e=>e.status==='Concluído')};}).filter(g=>!g.done);}
function render(){
 let open=openGroups().length,n=unsent();
 $('tabs').innerHTML=[['Hoje',''],['Em aberto',open],['Enviar',n]].map(([t,c])=>`<button type="button" ${t===tab?'aria-current="page"':''} data-tab="${t}">${t}${c?`<span class="n">${c}</span>`:''}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0);});
 $('sync').textContent=n?n+' para enviar':'Tudo enviado';$('sync').classList.toggle('pending',!!n);
 $('hsub').textContent=(getDay().author||db.profile||'Apontador')+' · '+br(day);
 ({'Hoje':pageToday,'Em aberto':pageOpen,'Enviar':pageSend})[tab]();
}

function evCard(e){let p=pieceMap.get(e.uid),n=(e.workers||[]).length,h=(e.workers||[]).reduce((s,w)=>s+(+w.hours||0),0);

// ---------- Folha: dados do dia ----------
function sheet(title,sub,progress){$('sheet').hidden=false;document.body.classList.add('lock');$('sh-t').textContent=title;$('sh-s').textContent=sub||'';$('sh-bar').style.width=(progress??100)+'%';$('sh-x').onclick=closeSheet;}

// ---------- Passo a passo do apontamento ----------
let wz=null;

function openWizard(ev){
 wz=ev?{id:ev.id,uid:ev.uid,service:ev.service,status:ev.status,startTime:ev.startTime,endTime:ev.endTime,team:ev.team,workers:(ev.workers||[]).map(w=>({...w})),concrete:ev.concrete,steel:ev.steel,description:ev.description,step:4,confirm:false}:{step:0,team:db.teams.find(t=>t.name===db.lastTeam)?.id||'',startTime:'07:00',endTime:'17:00',confirm:false};

}

 if(s===2){let st=svcState(p.u,wz.service);body=`${chosen(p,wz.service)}<p class="q">Como ficou hoje?</p><div class="seg status" id="status">${STATUS.map(v=>`<button type="button" data-v="${v}" aria-pressed="${wz.status===v}">${v}</button>`).join('')}</div>

 if(s===3){let team=db.teams.find(t=>t.id===wz.team);if(team&&!wz.workers)wz.workers=team.people.filter(x=>x.name).map(x=>({...x,hours:hoursOf(wz.startTime,wz.endTime),on:true}));

  ${!db.teams.length?'<p class="hint">Cadastre as equipes em Enviar › Equipes. Você pode seguir sem equipe.</p>':''}

  <label class="f" style="margin-top:12px">${wz.status==='Paralisada'?'Motivo da paralisação (obrigatório)':'Observação (opcional)'}<textarea id="desc">${esc(wz.description||'')}</textarea></label>
  <div id="walert"></div>

 $('sh-body').innerHTML=body;

function keep(){
 if($('t1'))wz.startTime=$('t1').value;if($('t2'))wz.endTime=$('t2').value;if($('desc'))wz.description=$('desc').value;
 if($('qc'))wz.concrete=$('qc').value===''?null:+$('qc').value;if($('qa'))wz.steel=$('qa').value===''?null:+$('qa').value;

function bindStep(s){
 if(s===0){let pq=$('pq'),act=0;const run=()=>{let toks=norm(pq.value).split(/\s+/).filter(Boolean);if(!toks.length){$('pres').innerHTML='';return;}let word=t=>new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)'),out=[];
   for(let p of catalog.pieces){if(!toks.every(t=>p.h.includes(t)))continue;let l=norm(p.l);out.push([-toks.filter(t=>word(t).test(l)).length*10-toks.filter(t=>l.includes(t)).length*3+(p.g?0:4)+l.length/200,p]);}
   out.sort((a,b)=>a[0]-b[0]);act=0;$('pres').innerHTML=out.slice(0,8).map(([,p],i)=>`<button type="button" class="res" role="option" data-u="${esc(p.u)}" aria-selected="${i===0}"><span class="k">${esc(p.k)}${p.t?' · T'+p.t:''}</span><span class="l">${esc(p.l)}</span><span class="a">${esc(place(p))}</span></button>`).join('')||'<p class="hint" style="padding:10px 12px;margin:0">Nada encontrado. Tente só o número: 23, AP05, A12.</p>';
   $('pres').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u));};
  pq.oninput=run;pq.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('pres').querySelector('[aria-selected=true]')?.click();}};
  document.querySelectorAll('.chips [data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u));
  setTimeout(()=>pq.focus(),80);}
 if(s===1)document.querySelectorAll('.svc').forEach(b=>b.onclick=()=>{wz.service=b.dataset.s;let st=svcState(wz.uid,wz.service);if(!wz.id)wz.status=st.k==='todo'?'Início':st.k==='done'?'':'Em andamento';wz.step=2;drawStep();});
 if(s===2)document.querySelectorAll('#status button').forEach(b=>b.onclick=()=>{keep();wz.status=b.dataset.v;drawStep();});

  document.querySelectorAll('.person input[type=checkbox]').forEach(c=>c.onchange=()=>{wz.workers[+c.dataset.i].on=c.checked;c.closest('.person').classList.toggle('off',!c.checked);});
  $('addx')&&($('addx').onclick=()=>{let n=$('extra').value.trim();if(!n)return;keep();wz.workers.push({name:n,role:'',hours:hoursOf(wz.startTime,wz.endTime),on:true,extra:true});drawStep();});
 }
 if(s===4){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{keep();wz.step=+b.dataset.jump;drawStep();});
  $('del')&&($('del').onclick=()=>{let b=$('del');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Toque de novo para excluir';return;}let e=db.events.find(x=>x.id===wz.id);e.deleted=true;e.updated=new Date().toISOString();save();closeSheet();note('Apontamento excluído. A exclusão também vai para o 3D.');});}
}

// ---------- Finalizar ----------
function finalize(){
 let d=getDay(),st=dayStats(day),problems=[];
 if(!d.author)problems.push('apontador');if(!d.front)problems.push('frente de serviço');if(d.rain.some(r=>!r))problems.push('chuva de manhã, tarde e noite');if(!st.evs.length)problems.push('pelo menos um apontamento');
 if(problems.length){note('Falta preencher: '+problems.join(', ')+'.',true);if(problems.some(p=>p!=='pelo menos um apontamento'))openDaySheet();return;}
 let b=$('finish');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar: finalizar e gerar PDF';setTimeout(()=>{if($('finish')){$('finish').dataset.armed='';$('finish').textContent='Finalizar RDO do dia';}},4000);return;}
 let rev=d.revs.length;d.finalized={at:new Date().toISOString(),rev};d.revs.push({rev,at:d.finalized.at});save();render();shareFiles(day,true);
}
const slug=s=>String(s||'apontador').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24);
function pkg(){return {schema:'alya-rdo-pacote-1',app:APP,from:db.profile||'',device:db.device,exported:new Date().toISOString(),catalog:catalog.generated,teams:db.teams,days:db.days,events:db.events};}
function pdfFile(d){let f=getDay(d).finalized,bytes=buildPdf(d);return new File([bytes],`RDO_${d}_${slug(getDay(d).author)}_Rev${f?f.rev:0}.pdf`,{type:'application/pdf'});}
async function shareFiles(d,withPkg){
 let files=[];try{if(d)files.push(pdfFile(d));if(withPkg){let p=pkg();files.push(new File([JSON.stringify(p)],`RDO_${slug(db.profile)}_${d||today()}.json`,{type:'application/json'}));db.sentAt=p.exported;}}catch(e){console.error(e);return note('Não foi possível gerar os arquivos: '+e.message,true);}
 save();render();
 if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:'RDO '+br(d||today()),text:'RDO '+br(d||today())+' · '+(db.profile||'')});return note('Arquivos compartilhados.');}catch(e){if(e.name==='AbortError')return note('Compartilhamento cancelado. Os arquivos podem ser baixados em Enviar.');}}
 for(let f of files){let url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
 note(files.length>1?'PDF e pacote salvos em Downloads. Envie pelo WhatsApp ou e-mail.':'Arquivo salvo em Downloads.');
}
function downloadPdf(d){let f=pdfFile(d),url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}

// ---------- PDF oficial ----------
function buildPdf(d){
 const doc=new MiniPDF.Doc(),day=getDay(d),st=dayStats(d),fin=day.finalized||{rev:day.revs.length,at:new Date().toISOString()};
 const M=36,W=doc.W-2*M,INK='#14202b',MUTE='#5b6773',LINE='#c9d1d8',HEAD='#1f2b36',AMB='#e3a82b',SOFT='#f2f4f6';
 const num=`${d.replace(/-/g,'')}-${slug(day.author).slice(0,3).toUpperCase()}`;
 doc.title=`RDO ${br(d)} · ${day.author}`;
 let y=0;
 const header=first=>{
  doc.rect(0,0,doc.W,6,{fill:AMB});
  doc.image(LOGO,M,22,0,34);
  doc.text(M+78,22,'Relatório Diário de Obra',{size:16,bold:true,color:INK});
  doc.text(M+78,42,`${OBRA.nome} · Obra ${OBRA.numero} · ${OBRA.empresa}`,{size:8.5,color:MUTE});
  doc.rect(doc.W-M-150,18,150,42,{stroke:LINE,lw:.8});
  doc.text(doc.W-M-142,23,'RDO nº',{size:7,color:MUTE});doc.text(doc.W-M-142,32,num,{size:9.5,bold:true,color:INK});
  doc.text(doc.W-M-142,46,`${br(d)} · ${weekday(d)}`,{size:8.5,color:INK});doc.text(doc.W-M-8,23,'Rev. '+fin.rev,{size:8.5,bold:true,color:INK,align:'right'});
  doc.line(M,70,doc.W-M,70,{color:INK,lw:1});
  y=82;
 };
 const footer=(i,n)=>{doc.line(M,doc.H-34,doc.W-M,doc.H-34,{color:LINE});doc.text(M,doc.H-28,`Gerado pelo ${APP} em ${new Date(fin.at).toLocaleString('pt-BR')} · ${st.evs.length} apontamentos`,{size:7,color:MUTE});doc.text(doc.W-M,doc.H-28,`Página ${i} de ${n}`,{size:7,color:MUTE,align:'right'});};
 const need=h=>{if(y+h>doc.H-48){doc.addPage();header(false);}};
 const section=(t,min=60)=>{need(21+min);doc.rect(M,y,W,17,{fill:HEAD});doc.text(M+7,y+4.5,t,{size:9,bold:true,color:'#ffffff'});y+=21;};
 const cells=(items,cols)=>{let cw=W/cols,rows=Math.ceil(items.length/cols);need(rows*28);items.forEach(([k,v],i)=>{let cx=M+(i%cols)*cw,cy=y+Math.floor(i/cols)*28;doc.rect(cx,cy,cw,28,{stroke:LINE,lw:.6});doc.text(cx+6,cy+4,k,{size:6.8,color:MUTE});let t=doc.wrap(v||'—',9,true,cw-12)[0];doc.text(cx+6,cy+14,t,{size:9,bold:true,color:INK});});y+=rows*28+8;};
 const table=(cols,rows,opt={})=>{
  const fs=opt.size||8,pad=4,lh=fs*1.25;
  const head=()=>{let h=0;let lines=cols.map(c=>doc.wrap(c.t,fs-.5,true,c.w*W-2*pad));h=Math.max(...lines.map(l=>l.length))*lh+2*pad;need(h+lh+2*pad);let x=M;cols.forEach((c,i)=>{doc.rect(x,y,c.w*W,h,{fill:SOFT,stroke:LINE,lw:.5});lines[i].forEach((ln,j)=>doc.text(c.align==='right'?x+c.w*W-pad:x+pad,y+pad+j*lh,ln,{size:fs-.5,bold:true,color:INK,align:c.align}));x+=c.w*W;});y+=h;};
  head();
  rows.forEach((r,ri)=>{let lines=cols.map((c,i)=>doc.wrap(r.cells[i]??'',fs,!!c.bold,c.w*W-2*pad)),h=Math.max(...lines.map(l=>l.length))*lh+2*pad,sub=r.sub?doc.wrap(r.sub,fs-.5,false,W-2*pad-10):[],sh=sub.length?sub.length*lh+pad:0;
   if(y+h+sh>doc.H-48){doc.addPage();header(false);head();}
   let x=M;cols.forEach((c,i)=>{doc.rect(x,y,c.w*W,h+sh,{stroke:LINE,lw:.5});lines[i].forEach((ln,j)=>doc.text(c.align==='right'?x+c.w*W-pad:x+pad,y+pad+j*lh,ln,{size:fs,bold:!!c.bold,color:INK,align:c.align}));x+=c.w*W;});
   if(sub.length){doc.rect(M,y+h,W,sh,{fill:'#fbf7ec',stroke:LINE,lw:.5});sub.forEach((ln,j)=>doc.text(M+pad+10,y+h+pad/2+j*lh,ln,{size:fs-.5,color:'#6b4f12'}));}
   y+=h+sh;});
  y+=10;
 };
 header(true);
 section('1. Identificação');
 cells([['Apontador',day.author],['Contrato',day.contract],['Frente de serviço',day.front],['Área de apoio',String(day.area||'')]],4);
 section('2. Condições do tempo');
 cells([['Manhã',day.rain[0]],['Tarde',day.rain[1]],['Noite',day.rain[2]],['Precipitação medida',day.mm!==''&&day.mm!=null?fmt(day.mm)+' mm':'Não medida']],4);
 section('3. Resumo do dia');
 cells([['Apontamentos',String(st.evs.length)],['Efetivo',st.people.length+' pessoas'],['Horas-homem',fmt(st.hh)+' h'],['Concreto / armação',(st.concrete?fmt(st.concrete,2)+' m³':'—')+' · '+(st.steel?fmt(st.steel,0)+' kg':'—')]],4);
 section('4. Atividades executadas');
 if(st.evs.length)table([{t:'#',w:.04},{t:'Peça / local',w:.25,bold:true},{t:'Serviço',w:.16},{t:'Situação',w:.11},{t:'Horário',w:.12},{t:'Encarregado',w:.14},{t:'Efetivo',w:.07,align:'right'},{t:'Qtd.',w:.11,align:'right'}],
  st.evs.map((e,i)=>{let p=pieceMap.get(e.uid),q=[e.concrete!=null?fmt(e.concrete,2)+' m³':'',e.steel!=null?fmt(e.steel,0)+' kg':''].filter(Boolean).join(' / ');return {cells:[String(i+1),(p?.l||e.piece||e.uid)+(p?'\n'+place(p):''),svcLabel(e.service),e.status,e.startTime?e.startTime+'–'+(e.endTime||''):'—',e.teamName||'—',String((e.workers||[]).length),q||'—'],sub:e.description?(e.status==='Paralisada'?'Motivo da paralisação: ':'Obs.: ')+e.description:''};}));
 else{need(20);doc.text(M,y,'Nenhuma atividade apontada.',{size:9,color:MUTE});y+=20;}
 section('5. Mão de obra');
 if(st.people.length){
  let roles=new Map;for(let p of st.people){let r=p.role||'Não informada',x=roles.get(r)||{n:0,h:0};x.n++;x.h+=p.hours;roles.set(r,x);}
  table([{t:'Função',w:.5,bold:true},{t:'Pessoas',w:.25,align:'right'},{t:'Horas-homem',w:.25,align:'right'}],[...roles.entries()].sort((a,b)=>b[1].n-a[1].n).map(([r,x])=>({cells:[r,String(x.n),fmt(x.h)]})).concat([{cells:['Total',String(st.people.length),fmt(st.hh)]}]));
  table([{t:'Nome',w:.3,bold:true},{t:'Função',w:.18},{t:'Encarregado',w:.26},{t:'Atividades',w:.12,align:'right'},{t:'Horas',w:.14,align:'right'}],st.people.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>({cells:[p.name,p.role||'—',[...p.teams].join(', ')||'—',String(p.acts),fmt(p.hours)]})),{size:7.5});
 }else{need(20);doc.text(M,y,'Nenhuma pessoa registrada nos apontamentos.',{size:9,color:MUTE});y+=20;}
 section('6. Equipamentos na frente');
 let eq=EQUIP.filter(t=>count(day.equipment[t]));
 if(eq.length)table([{t:'Equipamento',w:.35,bold:true},{t:'Identificação',w:.5},{t:'Qtd.',w:.15,align:'right'}],eq.map(t=>({cells:[t,day.equipment[t],String(count(day.equipment[t]))]})));
 else{need(20);doc.text(M,y,'Nenhum equipamento informado.',{size:9,color:MUTE});y+=20;}
 section('7. Observações e ocorrências',40);
 let para=st.evs.filter(e=>e.status==='Paralisada'),obs=[day.notes,...para.map(e=>'Paralisação · '+(pieceMap.get(e.uid)?.l||e.piece)+' · '+svcLabel(e.service)+': '+e.description)].filter(Boolean).join('\n');
 let lines=doc.wrap(obs||'Sem observações.',9,false,W-12);need(lines.length*12+14);doc.rect(M,y,W,lines.length*12+12,{stroke:LINE,lw:.6});lines.forEach((l,i)=>doc.text(M+6,y+6+i*12,l,{size:9,color:obs?INK:MUTE}));y+=lines.length*12+24;
 need(80);y=Math.max(y,doc.H-140);let sw=(W-30)/2;
 [[day.author,'Apontador'],['','Responsável pela frente']].forEach(([n,r],i)=>{let x=M+i*(sw+30);doc.line(x,y+40,x+sw,y+40,{color:INK,lw:.8});doc.text(x,y+45,n||' ',{size:9,bold:true,color:INK});doc.text(x,y+57,r,{size:8,color:MUTE});});
 let n=doc.pages.length;doc.pages.forEach((p,i)=>{doc.cur=p;footer(i+1,n);});
 return doc.output();
}

// ---------- Receber ----------
function mergePkg(x,name){
 if(x?.schema==='alya-catalogo-1'){if(!Array.isArray(x.pieces)||!x.pieces.length)throw Error(name+': catálogo vazio.');db.catalog=x;catalog=x;indexCatalog();return name+': catálogo com '+x.pieces.length+' peças carregado';}
 if(x?.schema!=='alya-rdo-pacote-1'||!Array.isArray(x.events))throw Error(name+': não é um arquivo do RDO nem catálogo do 3D.');
 for(let e of x.events)if(!e||typeof e.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!e.uid||!e.service||!STATUS.includes(e.status))throw Error(name+': apontamento inválido. Nada foi importado.');
 let add=0,upd=0;
 for(let e of x.events){e={...e,workers:(e.workers||[]).map(w=>typeof w==='string'?{name:w,role:'',hours:hoursOf(e.startTime,e.endTime)}:w)};let i=db.events.findIndex(o=>o.id===e.id);if(i<0){db.events.push(e);add++;}else if(String(e.updated||e.created)>String(db.events[i].updated||db.events[i].created)){db.events[i]=e;upd++;}}
 for(let t of x.teams||[])if(!db.teams.some(o=>o.id===t.id||o.name===t.name))db.teams.push({...t,people:(t.people||[]).map(person)});
 for(let [k,v] of Object.entries(x.days||{}))if(!db.days[k])db.days[k]={revs:[],equipment:{},rain:['','',''],...v};
 return name+': '+add+' novos'+(upd?', '+upd+' atualizados':'')+(x.from?' de '+x.from:'');
}
$('file').onchange=async()=>{let out=[];for(let f of [...$('file').files]){try{out.push(mergePkg(JSON.parse(await f.text()),f.name));}catch(e){out.push(e.message);}}$('file').value='';save();render();note(out.join(' · '),out.some(t=>/inválido|não é/.test(t)));};

render();
window.__rdo={get db(){return db},buildPdf,mergePkg,pkg,setDay:d=>{day=d;render();}};
</script>
