<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>RDO Alya · Ponte Joinville</title><script>/* polyfill */(function(){try{var at=function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;return this[n];};if(!Array.prototype.at)Object.defineProperty(Array.prototype,'at',{value:at,writable:true,configurable:true});if(!String.prototype.at)Object.defineProperty(String.prototype,'at',{value:at,writable:true,configurable:true});if(typeof structuredClone!=='function')window.structuredClone=function(v){return v===undefined?v:JSON.parse(JSON.stringify(v));};}catch(e){}window.addEventListener('error',function(e){var n=document.getElementById('notice');if(n){n.textContent='Erro ao abrir o RDO: '+(e.message||'desconhecido');n.className='on err';}});})();</script>
<style>
:root{--bg:#0e141a;--panel:#141c24;--raise:#1a242e;--line:#22303b;--line2:#304150;--ink:#e8edf2;--muted:#8a99a8;--amber:#f2b33d;--amber2:#ffd27a;--green:#3fb37f;--red:#e0675c;--rain:#3d9be9;--bolt:#b38cff;--f:Bahnschrift,"DIN Alternate","Segoe UI Variable Text","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#0b1117f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top img{height:30px;border-radius:2px}
header.top .t{flex:1;min-width:0}
header.top strong{display:block;font-size:15px;font-weight:600}
header.top small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.sync.pending{background:#2a2412;border-color:#6b5520;color:#f6dc9a}
nav.tabs{display:flex;max-width:760px;margin:14px auto 0;padding:0 16px}
nav.tabs button{flex:1;min-height:42px;border:1px solid var(--line2);background:var(--raise);color:#b8c4cf;font-size:14px;cursor:pointer}
nav.tabs button+button{border-left:0}
nav.tabs button:first-child{border-radius:8px 0 0 8px}
nav.tabs button:last-child{border-radius:0 8px 8px 0}
nav.tabs button[aria-current=page]{background:var(--amber);color:#18140a;border-color:var(--amber);font-weight:600}
nav.tabs .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:#0003;font-size:11px}
main{max-width:760px;margin:0 auto;padding:14px 16px 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:16px 0 8px;color:#c9d3dc;letter-spacing:.02em}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font-size:16px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a99a8 50%),linear-gradient(135deg,#8a99a8 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{color-scheme:dark}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px #f2b33d26}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:#d3dbe3;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#18140a;font-weight:600}
.btn.go{background:var(--green);border-color:var(--green);color:#06150e;font-weight:600}
.btn.big{width:100%;min-height:56px;font-size:16.5px}
/* Botão de arrastar para finalizar (V0.15, baseado no SlideCommit enviado pelo Mathyas) */
.sc{--t:#262626;--h:#eab308;--ok:#22c55e;--no:#e5484d;position:relative;width:100%;height:56px;margin-top:6px}
.sc-t{position:relative;width:100%;height:100%;border-radius:28px;background:var(--t);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.sc.held .sc-t{cursor:grabbing}.sc[data-p=pending] .sc-t,.sc[data-p=done] .sc-t{cursor:default}
.sc-l{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.sc-x,.sc-e{grid-area:1/1;transition:opacity .2s,filter .2s}.sc-x{color:rgba(245,245,245,.5)}.sc-e{color:var(--no);opacity:0;filter:blur(2px)}
.sc[data-p=error] .sc-x{opacity:0;filter:blur(2px)}.sc[data-p=error] .sc-e{opacity:1;filter:none}
.sc-c{position:absolute;top:4px;left:4px;height:48px;width:48px;border-radius:24px;background:var(--h);color:#111;outline:none;overflow:hidden;transition:background-color .2s,color .2s}
.sc-c:focus-visible{box-shadow:inset 0 0 0 2px #fff8}
.sc[data-p=done] .sc-c{background:var(--ok)}.sc[data-p=error] .sc-c{background:var(--no);color:#fff}
.sc-i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none;transition:opacity .2s}
.sc-i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sc-s,.sc-d{opacity:0}.sc[data-p=pending] .sc-a{opacity:0}.sc[data-p=pending] .sc-s{opacity:1}.sc[data-p=done] .sc-a{opacity:0}.sc[data-p=done] .sc-d{opacity:1}
.sc-sp{animation:scspin 1s linear infinite}@keyframes scspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sc-sp{animation:none}}
.btn.ghost{background:transparent}
.btn.danger{color:#f3a49c;border-color:#5a2f2c;background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.dash{border-style:dashed;background:transparent;color:#cfd8e1;width:100%}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--raise)}
.seg button{flex:1;min-height:46px;padding:4px 6px;border:0;background:transparent;color:#b8c4cf;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button small{font-size:11.5px;opacity:.8}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--amber);color:#18140a;font-weight:600}
.seg.status button[data-v="Concluído"][aria-pressed=true]{background:var(--green);color:#06150e}
/* Dia */
.day{display:flex;align-items:center;gap:10px}
.day .nav{width:46px;flex-shrink:0;padding:0;font-size:20px}
.day .d{flex:1;text-align:center;min-width:0}
.day .d b{display:block;font-size:18px;font-weight:600}
.day .d span{font-size:12.5px;color:var(--muted)}
.he{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:#3a2a10;color:var(--amber2);margin-left:6px;vertical-align:1px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 12px}
.steps a{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel);text-align:center;min-width:0}
.steps a b{font-size:13px;color:#c9d3dc;font-weight:600}
.steps a.ok{border-color:#2b6047;background:#12241c;color:#8fdcb6}
.steps a.ok b{color:#d8f5e6}
.steps a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:#13281f;border:1px solid #2b6047;color:#a9e7c7;margin-bottom:12px;flex-wrap:wrap}
.final div{flex:1;font-size:13.5px;min-width:180px}
.final b{display:block;font-size:15px;color:#d8f5e6}
/* Seções numeradas */
.sec{scroll-margin-top:70px}
.sh{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
.sh .ix{font-size:12px;font-weight:700;letter-spacing:.06em;color:#18140a;background:var(--amber);border-radius:6px;padding:3px 7px}
.sh h2{margin:0;flex:1;font-size:16.5px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:12px;background:#22303d;color:#c6d0da;white-space:nowrap}
.pill.ok{background:#13281f;color:#8fdcb6}
.pill.warn{background:#2a2412;color:#f6dc9a}
/* Pluviômetro */
.wx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wx .p{border:1px solid var(--line2);border-radius:10px;padding:10px 8px 8px;background:var(--raise);text-align:center}
.wx .p > b{display:block;font-size:13px;margin-bottom:8px}
.wx .p > b small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.wx .opt{display:flex;gap:6px}
.wx .opt button{flex:1;min-height:52px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:#b8c4cf;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;padding:4px 2px}
.wx .opt button[data-v="1"][aria-pressed=true]{background:#15324d;border-color:var(--rain);color:#cfe7ff}
.wx .opt button[data-v="0"][aria-pressed=true]{background:#2a2412;border-color:#8a6a24;color:#f6dc9a}
.reads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rd{border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--raise)}
.rd .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rd .hd b{font-size:20px;font-variant-numeric:tabular-nums}
.rd .hd span{font-size:11.5px;color:var(--muted);text-align:right}
.mm{position:relative;margin-top:8px}
.mm input{font-size:24px;font-weight:600;text-align:center;padding-right:44px;min-height:54px;font-variant-numeric:tabular-nums}
.mm i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px}
.ph{margin-top:8px;display:flex;gap:8px;align-items:center}
.ph label{flex:1;min-height:44px;border-radius:8px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:#cfd8e1;cursor:pointer}
.ph .okt{flex:1;font-size:13px;color:#8fdcb6;min-width:0}
.ph label{min-width:0;flex-direction:column;gap:2px;min-height:54px;font-size:12.5px;padding:4px}
.rmph{width:36px;height:36px;border-radius:8px;border:1px solid #5a2f2c;background:transparent;color:#f3a49c;cursor:pointer;flex-shrink:0}
.wx .p.off{opacity:.45}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp select{padding-left:10px;padding-right:24px;background-position:calc(100% - 14px) 20px,calc(100% - 9px) 20px}
.ws{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--raise);margin-bottom:8px}
.wsh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wsh b{font-size:15px;min-width:24px}
.wsh .seg{flex:1}
.wsh .seg button{min-height:40px;flex-direction:row;gap:6px}
.wsh .seg button[data-wt=c][aria-pressed=true]{background:#15324d;color:#cfe7ff}
.wsh .seg button[data-wt=r][aria-pressed=true]{background:#2a1f45;color:#e6dbff}
.wsh .x{width:40px;height:40px;border-radius:8px;border:1px solid #5a2f2c;background:transparent;color:#f3a49c;cursor:pointer}
.pg{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--raise);margin-bottom:8px}
.pgh{display:flex;align-items:center;gap:10px}
.pgh div{flex:1;min-width:0}
.pgh b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgh span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line2);background:#16202a;display:block}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer}
.thumbs:empty{display:none}
a.btn{text-decoration:none}
.ph label.has{border-style:solid;border-color:#2b6047;color:#8fdcb6;background:#12241c}
.ph img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line2)}
.ph input{display:none}
.tools{display:flex;gap:6px;margin:10px 0 8px}
.tools button{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--raise);color:#c6d0da;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px}
.tools button[aria-pressed=true][data-t=c]{background:#15324d;border-color:var(--rain);color:#cfe7ff}
.tools button[aria-pressed=true][data-t=r]{background:#2a1f45;border-color:var(--bolt);color:#e6dbff}
.tools button[aria-pressed=true][data-t=x]{background:#2a1716;border-color:#7a3a35;color:#f3b4ad}
.tl{display:grid;gap:4px}
.tl .h{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:4px;align-items:center}
.tl .h > button:first-child{min-height:34px;border:0;background:transparent;color:var(--muted);font-size:12.5px;text-align:left;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.tl .cl{min-height:34px;border-radius:6px;border:1px solid var(--line2);background:#16202a;cursor:pointer;padding:0;font-size:10px;color:transparent}
.tl .cl.tc{background:var(--rain);border-color:var(--rain);color:#08243d}
.tl .cl.tr{background:var(--bolt);border-color:var(--bolt);color:#1e1236}
.tl .cl.part{background-image:repeating-linear-gradient(45deg,transparent 0 4px,#ffffff10 4px 8px)}
.tlsum{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tlsum span{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--raise);border:1px solid var(--line2)}
.tlsum span b{font-variant-numeric:tabular-nums}
.tlsum .c{border-color:#24557f;color:#cfe7ff}
.tlsum .r{border-color:#4d3a7a;color:#e6dbff}
/* Equipes */
.crew{border:1px solid var(--line2);border-radius:10px;background:var(--raise);margin-bottom:8px;overflow:hidden}
.crew .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.crew .hd .av{width:34px;height:34px;border-radius:50%;background:#2a2412;color:var(--amber);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.crew .hd .nm{flex:1;min-width:0}
.crew .hd .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .hd .nm span{font-size:11.5px;color:var(--muted)}
.crew .hd .tot{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.crew .hd .tot small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.fn{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid #1d2832}
.fn:first-of-type{border-top:0}
.fn span{flex:1;font-size:14px;min-width:0}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#141d26}
.stp button{width:42px;height:40px;border:0;background:transparent;color:#d3dbe3;font-size:20px;cursor:pointer}
.stp button:disabled{opacity:.3}
.stp b{min-width:34px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.stp.z b{color:var(--muted);font-weight:400}
.crew .ft{display:flex;justify-content:flex-end;padding:6px 8px;border-top:1px solid var(--line)}
/* Atividades e paralisações */
.it{display:grid;grid-template-columns:4px 1fr auto;gap:2px 12px;padding:12px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);margin-bottom:8px;cursor:pointer;text-align:left;width:100%;color:inherit}
.it > i{grid-row:span 3;border-radius:2px;background:var(--amber)}
.it > i.k-ok{background:var(--green)}
.it > i.k-x{background:#6f8fb3}
.it > i.k-s{background:var(--red)}
.it .p{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .st{font-size:12px;font-weight:600;white-space:nowrap;color:#f6dc9a}
.it .st.k-ok{color:#8fdcb6}
.it .st.k-x{color:#a9c1dc}
.it .st.k-s{color:#f3a49c}
.it .sb{font-size:13px;color:#c9d3dc;grid-column:2/-1}
.it .mt{font-size:12px;color:var(--muted);grid-column:2/-1}
.it .cc{color:#9fd3ff}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.addrow .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.tm{display:grid;gap:6px;padding:4px 12px 8px}
.tq{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:inherit;font:inherit;cursor:pointer}
.tq small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.tq[aria-pressed=true]{border-color:#3fb37f88}
.tq[aria-pressed=false]{opacity:.55;text-decoration:line-through}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;margin-bottom:6px}
.trow span{display:block;color:var(--muted);font-size:12px}
.tg3{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:999px;background:#5b3fd133;color:#c9b8ff;margin-right:6px;vertical-align:1px}
html.light .tg3{background:#5b3fd122;color:#4a2fb0}
.empty{color:var(--muted);font-size:13.5px;margin:2px 0 10px;text-align:center;padding:16px 10px;border:1px dashed var(--line2);border-radius:10px}
details.card{padding:0}
details.card>summary{padding:15px 16px;font-size:15px;font-weight:600;cursor:pointer}
details.card>div{padding:0 16px 16px}
.eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.eqsum{display:flex;flex-direction:column;gap:10px}
.eqr{padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise)}
.eqh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.eqh b{font-weight:600;font-size:14px}.eqh span{font-size:12px;color:var(--muted);white-space:nowrap}
.eqr .chips{margin-top:6px}
.eqv{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);font-size:13.5px;color:#c6d0da}
.chips button.add{border-style:dashed;color:var(--amber2)}
.chips button.rm{border-color:#5a2f2c;color:#f3a49c}
.eqf{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:12px;border:1px dashed var(--line2);border-radius:10px}
.eqb{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.eqf .eqb{margin-top:0}
.eq small{font-size:11.5px;color:var(--muted)}
/* Folha (passo a passo e formulários) */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0b1117}
#sheet header .ttl{flex:1;min-width:0}
#sheet header b{display:block;font-size:15px}
#sheet header span{font-size:12px;color:var(--muted)}
#sheet .bar{height:3px;background:var(--line)}
#sheet .bar i{display:block;height:100%;background:var(--amber);transition:width .25s}
#sheet .body{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
#sheet footer{display:flex;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b1117;max-width:760px;width:100%;margin:0 auto}
#sheet footer .btn{flex:1}
.q{font-size:19px;font-weight:600;margin:2px 0 12px}
.picker{position:relative}
.picker svg{position:absolute;left:12px;top:23px;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.picker input{padding-left:38px}
.results{margin-top:8px;border:1px solid var(--line2);border-radius:10px;background:#141d26;overflow:hidden}
.results:empty{display:none}
.res{display:grid;grid-template-columns:96px 1fr;column-gap:10px;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer;color:inherit}
.res:first-child{border-top:0}
.res:hover,.res:focus,.res[aria-selected=true]{background:#22303d;outline:none}
.res .k{grid-row:span 2;font-size:11.5px;color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .l{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line2);background:transparent;color:#c6d0da;font-size:13.5px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button[aria-pressed=true]{background:#2a2412;border-color:var(--amber);color:var(--amber2)}
.chosen{padding:12px 14px;border-radius:10px;border:1px solid #6b5520;background:#211c10;margin-bottom:14px}
.chosen .ck{font-size:11.5px;color:var(--amber)}
.chosen .cl{font-size:16px;font-weight:600}
.chosen .ca{font-size:12.5px;color:#c9b98d}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;min-height:62px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);cursor:pointer;text-align:left}
.svc b{font-size:14.5px;font-weight:600}
.svc span{font-size:11.5px;color:var(--muted)}
.svc.done span{color:#7fd4ab}
.svc.open span,.svc.stop span{color:#f2c86a}
.svc[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);background:#2a2412}
.fl{display:grid;gap:6px}
.fopt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;text-align:left;width:100%;color:inherit}
.fopt:hover{border-color:var(--amber)}
.fopt .av{width:36px;height:36px;border-radius:50%;background:#2a2412;color:var(--amber);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.fopt b{display:block;font-size:14.5px}
.fopt span{font-size:12px;color:var(--muted)}
.cs .crew{background:#141d26}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;min-height:50px;border-radius:9px;border:1px solid var(--line2);background:var(--raise);color:#c6d0da;cursor:pointer;font-size:15px}
.toggle button[aria-pressed=true]{background:#15324d;border-color:var(--rain);color:#cfe7ff;font-weight:600}
.toggle button[data-v="0"][aria-pressed=true]{background:#22303d;border-color:#4a5b6b;color:#e8edf2}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.alert{font-size:13.5px;padding:10px 12px;border-radius:8px;background:#2a2412;border:1px solid #6b5520;color:#f6dc9a;margin:12px 0 0}
.alert.err{background:#2a1716;border-color:#7a3a35;color:#f3b4ad}
.alert ul{margin:6px 0 0;padding-left:18px}
.sum{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.sum span{color:var(--muted)}
.days .drow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.days .drow:first-child{border-top:0}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#22303d;color:#c6d0da;white-space:nowrap}
.tag.ok{background:#13281f;color:#8fdcb6}
.flist .fr{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.flist .fr:first-child{border-top:0}
.flist .fr span{color:var(--muted);font-size:12px;text-align:right}
#notice{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;max-width:min(560px,calc(100% - 24px));background:#1b2631;border:1px solid var(--line2);border-radius:10px;padding:11px 15px;font-size:14px;box-shadow:0 12px 30px #0008;transition:.22s;pointer-events:none}
#notice.on{opacity:1;transform:translate(-50%,0)}
#notice.err{border-color:#7a3a35;background:#2a1716}
@media(max-width:720px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:6px 8px max(6px,env(safe-area-inset-bottom));background:#0b1117f5;border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);will-change:transform}
 body.kb nav.tabs{visibility:hidden}
 nav.tabs button,nav.tabs button:first-child,nav.tabs button:last-child{border:0;border-radius:9px;background:transparent;font-size:13px;min-height:50px}
 nav.tabs button[aria-current=page]{background:#2a2412;color:var(--amber)}
 main{padding:12px 12px 130px}
 .eq{grid-template-columns:1fr}
 header.top .sync{display:none}
 .steps a{font-size:10px;padding:7px 3px}
}
@media(max-width:380px){.reads{grid-template-columns:1fr}.wx .opt button{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){#notice,#sheet .bar i{transition:none}}

/* ---------- Tema escuro glass (V0.7): mesmas cores, superfícies translúcidas com desfoque ---------- */
:root{--panel:rgba(20,28,36,.58);--raise:rgba(26,36,46,.52);--line:rgba(140,170,195,.14);--line2:rgba(150,180,205,.2);--glass:blur(18px) saturate(150%);--hi:inset 0 1px 0 rgba(255,255,255,.06)}
html{background:var(--bg)}
body,#sheet{background:radial-gradient(900px 600px at 0% -10%,rgba(242,179,61,.17),transparent 60%),radial-gradient(800px 700px at 110% 30%,rgba(61,155,233,.16),transparent 60%),radial-gradient(700px 600px at 20% 110%,rgba(63,179,127,.1),transparent 60%),var(--bg);background-attachment:fixed}
header.top{background:rgba(11,17,23,.55);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom-color:var(--line)}
.card,.sum{background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--hi),0 12px 32px rgba(0,0,0,.28);border-color:var(--line)}
.crew,.it,.ws,.rd,.pg,.fopt,.svc,.toggle button,.tools button,.seg{box-shadow:var(--hi)}
.results,.stp{background:rgba(20,29,38,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
#sheet header,#sheet footer{background:rgba(11,17,23,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
#notice{background:rgba(27,38,49,.72);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--hi),0 12px 30px rgba(0,0,0,.4)}
.alert{background:rgba(42,36,18,.6)}.final{background:rgba(19,40,31,.62)}.chosen{background:rgba(33,28,16,.6)}
input,select,textarea{background:rgba(26,36,46,.55)}
.btn{box-shadow:var(--hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--panel:#141c24;--raise:#1a242e}header.top,#sheet header,#sheet footer{background:#0b1117f2}}

/* ---------- V0.16 ---------- */
.frs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2>label.fr{grid-column:1/-1}
html.light .steps a{background:#fff;color:#3a4a58;border-color:var(--line2)}html.light .steps a.ok{background:#e3f5ec;color:#145c39;border-color:#9bd3b5}html.light .steps a b{color:inherit}
.resumo .rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.resumo .rgrid div{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--raise);min-width:0}
.resumo .rgrid span{display:block;font-size:11.5px;color:var(--muted)}.resumo .rgrid b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.resumo .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card.sec .sh{cursor:pointer;user-select:none}
.card.sec .sh::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 0 10px;flex-shrink:0;transition:transform .2s}
.card.sec.col .sh::after{transform:rotate(-45deg)}
.card.sec.col>:not(.sh){display:none!important}
.card.sec.col{padding-bottom:14px}
.thm{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.thm::before{content:"☀";font-size:18px}html.light .thm::before{content:"☾"}
p.ver{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}
@media(max-width:720px){p.ver{margin-bottom:96px}}

   for(let [f,n] of need){if(!n)continue;let k=crew.id+'|'+f,pool=pools.get(k)||[];pools.set(k,pool);let got=0;
    for(let i=0;i<pool.length&&got<n;i++)if(pool[i].every(([s,e])=>a.em<=s||a.sm>=e)){pool[i].push([a.sm,a.em]);ws.push(worker(F,f,i,h,a));got++;}
    while(got<n){pool.push([[a.sm,a.em]]);ws.push(worker(F,f,pool.length-1,h,a));got++;}}}
  out.set(a.key,ws);}
 return out;}

// Conferência da equipe (V0.19): cada pessoa da equipe tem que estar em alguma atividade e ninguém pode estar
// em duas atividades ao mesmo tempo. Por função: no pico do dia o número apontado tem que chegar ao da equipe
// (senão falta gente) e em nenhum horário pode passar dele (senão está duplicado).
function crewCheck(d=day){let x=getDay(d),w0=win(d,x.shift),acts=listActs(d),out=[],w={a:Math.min(w0.a,...acts.map(a=>a.sm??w0.a)),b:Math.max(w0.b,...acts.map(a=>a.em||0))};
 for(let c of allCrews(x)){
  for(let [f,nv] of Object.entries(c.counts||{})){let N=+nv||0;if(!N)continue;let mx=0,over=null;
   for(let m=w.a;m<w.b;m+=15){let n=0;for(let a of acts){if(!(a.sm<m+15&&a.em>m))continue;for(let k of a.crews||[])if(k.id===c.id)n+=k.counts?(+k.counts[f]||0):N;}
    mx=Math.max(mx,n);if(n>N){if(!over)over={a:m,b:m+15,n};else if(over.b===m){over.b=m+15;over.n=Math.max(over.n,n);}}}
   let fn=title(f).toLowerCase(),eq=(c.t?empName(c.emp)+' · ':'')+short(c.fid);
   if(over)out.push(`${eq}: ${over.n} ${fn}${over.n>1?'s':''} apontados ao mesmo tempo (${span(over.a,over.b)}), a equipe tem ${N}`);
   else if(mx<N)out.push(`${eq}: ${N-mx} ${fn}${N-mx>1?'s':''} sem atividade (equipe tem ${N}, apontados ${mx})`);}}
 return out;}

 if($('eqRmT'))$('eqRmT').onclick=()=>{let b=$('eqRmT');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Toque de novo para remover '+c.t;return;}

// envia os cadastros pendentes e traz a lista da nuvem (cadastros de todos os apontadores)
let eqSyncing=false;
async function eqSync(){if(eqSyncing||location.protocol==='file:'||!navigator.onLine)return;eqSyncing=true;
 try{
  while((db.eqPend||[]).length){let o=db.eqPend[0];
   let r=await fetch('/api/rdo/ativos',{method:o.op==='add'?'POST':'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({e:o.e,a:o.a})});
   if(!r.ok&&![400,404,409].includes(r.status))throw Error('ativos '+r.status);   // sem sessão ou fora do ar: tenta de novo depois
   db.eqPend.shift();save();}
  let r=await fetch('/api/rdo/ativos',{cache:'no-store'});
  if(r.ok&&/json/.test(r.headers.get('content-type')||'')){let j=await r.json();db.eqSrv={itens:Array.isArray(j.itens)?j.itens:[],t:Date.now()};save();if($('eqW')&&!document.activeElement?.closest?.('#eqW'))drawEq();}
 }catch(e){console.warn(e);}
 eqSyncing=false;}
addEventListener('online',()=>setTimeout(eqSync,2000));setTimeout(eqSync,2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')eqSync();});

function crewPicker(state){let x=getDay(),L=state.terc?x.tcrews:x.crews;if(!L.length)return `<p class="alert">${state.terc?'Nenhuma equipe de terceiros lançada hoje. Escolha a empresa e o encarregado.':'Nenhuma equipe lançada hoje. Adicione o encarregado e as quantidades.'}</p><button class="btn dash" type="button" id="csAdd" style="margin-top:10px">${ICON.plus}Adicionar equipe</button>`;
 return `<div class="chips" id="csChips">${L.map(c=>`<button type="button" data-cs="${c.id}" aria-pressed="${state.crews.some(k=>k.id===c.id)}">${c.t?esc(empName(c.emp))+' · ':''}${esc(short(c.fid))} · ${crewTotal(c)}</button>`).join('')}<button type="button" id="csAdd">+ Outra equipe</button></div>
 <div class="cs" style="margin-top:10px">${state.crews.map(sc=>{let c=crewOf(x,sc.id);if(!c)return '';let F=fOf(c);return `<div class="crew" data-csc="${c.id}"><div class="hd"><span class="av">${initials(F.n)}</span><div class="nm"><b>${esc(title(F.n))}</b><span>${sc.counts?'Parte da equipe nesta atividade':'Equipe inteira nesta atividade'}</span></div></div>${F.f.filter(f=>+c.counts[f]).map(f=>{let max=+c.counts[f],n=sc.counts&&sc.counts[f]!=null?Math.min(+sc.counts[f],max):max;return `<div class="fn"><span>${esc(title(f))} <small class="muted">de ${max}</small></span><div class="stp ${n?'':'z'}"><button type="button" data-cf="${esc(f)}" data-d="-1" ${n?'':'disabled'}>−</button><b>${n}</b><button type="button" data-cf="${esc(f)}" data-d="1" ${n>=max?'disabled':''}>+</button></div></div>`;}).join('')||'<p class="hint" style="padding:0 12px 10px">Equipe sem quantidades. Ajuste em '+(c.t?'3T · Terceiros':'03 · Equipes')+'.</p>'}</div>`;}).join('')}</div>`;}
function bindCrewPicker(state,redraw){let x=getDay();

// Sugestões no assistente (V0.16): peças com serviço em andamento (do lado da frente escolhida) e serviços mais usados
function inProgress(x){let lado=frParse(x.front).l,last=new Map;
 for(let e of live()){if(e.date>day)continue;let k=e.uid+'|'+e.service,o=last.get(k);if(!o||String(e.date+e.updated)>String(o.date+o.updated))last.set(k,e);}
 let out=[],seen=new Set;for(let e of [...last.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date)))){if(e.status==='Concluído'||seen.has(e.uid))continue;let p=pieceMap.get(e.uid);if(!p)continue;if(lado&&sideName(p.s)!==lado)continue;if(svcState(e.uid,e.service).k==='done')continue;seen.add(e.uid);out.push(p);if(out.length>=10)break;}
  // completa com peças que a planilha mostra começadas e não terminadas (mesmo lado)
 if(out.length<10)for(let p of catalog.pieces){if(out.length>=10)break;if(seen.has(p.u)||(lado&&sideName(p.s)!==lado))continue;if(Object.values(p.v||{}).some(([a,b])=>a&&!b)){seen.add(p.u);out.push(p);}}
 return out;}
const svcUse=sv=>{let a=getDay().author;return live().filter(e=>e.service===sv&&(!a||e.author===a)).length;};

  :{terc:!!preset?.terc,step:0,sm:preset?.sm??w.a,em:preset?.em??w.b,crews:structuredClone(preset?.crews||[]),hasC:null,confirm:false};
 drawStep();}

function drawStep(){
 let s=wz.step,p=pieceMap.get(wz.uid),x=getDay(),w=win(day,x.shift);
 sheet((wz.terc?'Terceiros · ':'')+(wz.id?'Corrigir atividade':'Atividade do 3D'),`Passo ${s+1} de 5 · ${STEPS[s]}`,(s+1)*20);
 let body='',canNext=true;
 if(s===0){body=`<p class="q">Qual peça?</p><div class="picker"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><input id="pq" type="search" autocomplete="off" placeholder="VPM 23, AP05, aduela A12, estaca E-03" aria-label="Buscar peça"></div><div class="results" id="pres" role="listbox"></div>
  ${(()=>{let L=inProgress(x);return L.length?`<h3>Em andamento${frParse(x.front).l?' · '+frParse(x.front).l:''}</h3><div class="chips">${L.map(r=>`<button type="button" data-u="${esc(r.u)}">${esc(r.l)}</button>`).join('')}</div>`:'';})()}
  ${db.recent.length?`<h3>Usadas recentemente</h3><div class="chips">${db.recent.map(u=>pieceMap.get(u)).filter(Boolean).slice(0,8).map(r=>`<button type="button" data-u="${esc(r.u)}">${esc(r.l)}</button>`).join('')}</div>`:''}
  ${p?`<div class="chosen" style="margin-top:14px"><div class="ck">Selecionada</div><div class="cl">${esc(p.l)}</div><div class="ca">${esc(place(p))}</div></div>`:''}`;canNext=!!p;}
 if(s===1){body=`${chosen(p)}<p class="q">Qual serviço?</p><div class="svcs">${services(p.u).map((sv,i)=>[sv,i]).sort((a,b)=>svcUse(b[0])-svcUse(a[0])||a[1]-b[1]).map(([sv])=>{let st=svcState(p.u,sv),t={done:'Concluído '+br(st.d),open:'Em andamento desde '+br(st.d),todo:'Não iniciado'}[st.k];return `<button type="button" class="svc ${st.k}" data-s="${esc(sv)}" aria-pressed="${wz.service===sv}"><b>${esc(svcLabel(sv))}</b><span>${t}</span></button>`;}).join('')}</div>`;canNext=!!wz.service;}
 if(s===2){let st=svcState(p.u,wz.service);body=`${chosen(p,wz.service)}<p class="q">Como ficou hoje?</p><div class="seg status" id="status">${STATUS.map(v=>`<button type="button" data-v="${v}" aria-pressed="${wz.status===v}">${v}</button>`).join('')}</div>
  ${st.k==='done'?`<p class="alert">Este serviço já consta concluído em ${br(st.d)}.</p>`:''}
  <h3>Horário nesta atividade</h3><div class="grid2"><label class="f">Começou às${tp('t1',w,wz.sm)}</label><label class="f">Terminou às${tp('t2',w,wz.em)}</label></div>
  <p class="hint">Turno ${x.shift==='noite'?'da noite':'do dia'}: ${winLabel(day,x.shift)}. Se a equipe parou no meio, registre em 05 · Paralisações.</p>`;canNext=!!wz.status;}
 if(s===3){body=`${chosen(p,wz.service)}<p class="q">Quais equipes?</p>${crewPicker(wz)}<p class="hint">Toque no encarregado para incluir a equipe. Se só parte dela trabalhou aqui, diminua as quantidades.</p>`;canNext=wz.crews.length>0;}

   for(let p of catalog.pieces){if(!toks.every(t=>p.h.includes(t)))continue;let l=norm(p.l);out.push([-toks.filter(t=>word(t).test(l)).length*10-toks.filter(t=>l.includes(t)).length*3+(p.g?0:4)+l.length/200,p]);}
   out.sort((a,b)=>a[0]-b[0]);$('pres').innerHTML=out.slice(0,8).map(([,p],i)=>`<button type="button" class="res" role="option" data-u="${esc(p.u)}" aria-selected="${i===0}"><span class="k">${esc(p.k)}${p.t?' · T'+p.t:''}</span><span class="l">${esc(p.l)}</span><span class="a">${esc(place(p))}</span></button>`).join('')||'<p class="hint" style="padding:10px 12px;margin:0">Nada encontrado. Tente só o número: 23, AP05, A12.</p>';

// Pedido de correção (V0.16): o responsável marca na Pasta do RDO; aparece aqui no dia, até ser enviado de novo

function corrBanner(){let x=getDay(),L=corrFor(day,x),el=$('corr');if(!L.length){if(el)el.remove();return;}
 if(!el){el=document.createElement('div');el.id='corr';$('content').prepend(el);}
 el.className='alert err';el.innerHTML=`<b>Correção pedida pelo responsável:</b> ${L.map(c=>esc(c.msg)).join(' · ')}<br><span style="font-size:13px">${x.finalized?'Toque em <b>Reabrir</b>, corrija e arraste para enviar de novo.':'Corrija e arraste para enviar de novo.'}</span>`;}
async function corrSync(){if(location.protocol==='file:'||!navigator.onLine)return;try{let r=await fetch('/api/rdo/correcoes',{cache:'no-store'});if(!r.ok||!/json/.test(r.headers.get('content-type')||''))return;let j=await r.json(),old=corrs.length;corrs=j.itens||[];
 let mine=corrs.filter(c=>Object.entries(db.days).some(([d,x])=>corrFor(d,x).includes(c)));if(mine.length&&tab==='Hoje'){corrBanner();if(!old)note('Tem '+(mine.length>1?mine.length+' pedidos':'um pedido')+' de correção do responsável. Veja em Dias registrados.',true);}}catch(e){}}
setTimeout(corrSync,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')corrSync();});
// Cópia de segurança no site (V0.16): os dados deste celular (sem as fotos) vão para o site de tempos em tempos
let bkT=0,bkLast=0,bkBusy=false;
function bkSchedule(soon){clearTimeout(bkT);bkT=setTimeout(bkSend,soon?1500:Math.max(20000,180000-(Date.now()-bkLast)));}
function bkDias(){let out={},ds=Object.keys(db.days).sort().slice(-7);for(let d of ds){let x=db.days[d];if(!x||(!x.crews?.length&&!listActs(d).length&&!x.finalized))continue;out[d]={s:x.finalized?(siteOk(x)?'enviado':'pendente'):'aberto',a:x.author||'',t:x.shift||'dia',u:x.updated||''};}return out;}
async function bkSend(){if(bkBusy||location.protocol==='file:'||!navigator.onLine)return;bkBusy=true;
 try{let r=await fetch('/api/rdo/backup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({device:db.device,profile:db.profile,app:APP,dias:bkDias(),db})});if(r.ok){bkLast=Date.now();db.bkAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}}catch(e){}
 bkBusy=false;}
addEventListener('online',()=>bkSchedule(true));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Date.now()-bkLast>60000)bkSend();});setTimeout(()=>bkSchedule(true),6000);

  box.querySelectorAll('[data-bk]').forEach(btn=>btn.onclick=async()=>{if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Trocar os dados deste celular?';return;}

// ---------- Finalizar ----------
function finalize(){
 let x=getDay(),st=dayStats(),block=[],warn=[];
 if(!x.author)block.push('nome do apontador');
 if(ownP(x).some(i=>x.rainP[i]==null))block.push(x.shift==='noite'?'chuva da noite':'chuva da manhã e da tarde');if(x.wstops.some(p=>p.em<=p.sm))block.push('parada por chuva/raio com fim antes do início');
 if(!x.pluv)block.push('qual pluviômetro (Adhemar ou Boa Vista)');
 if(!x.crews.length)block.push('equipes do dia');
 if(!st.acts.length)block.push('pelo menos uma atividade');
 if(!eqCount(x))block.push('equipamentos na frente (07)');
 for(let m of crewCheck())block.push(m);
 let empty=x.crews.filter(c=>crewTotal(c)===1);if(empty.length)warn.push('equipe sem quantidades: '+empty.map(c=>short(c.fid)).join(', '));
 let idle=allCrews(x).filter(c=>!st.acts.some(a=>a.crews.some(k=>k.id===c.id)));if(idle.length)warn.push('equipe sem atividade: '+idle.map(c=>(c.t?empName(c.emp)+' · ':'')+short(c.fid)).join(', '));
 let tE=x.tcrews.filter(c=>crewTotal(c)===1);if(tE.length)warn.push('equipe de terceiros sem colaboradores: '+tE.map(c=>short(c.fid)).join(', '));
 // chuva medida × "não choveu" (17h mede 07h–17h: manhã e tarde; 07h mede a noite)
 if(x.shift!=='noite'&&+x.mm17>0&&x.rainP[0]===false&&x.rainP[1]===false)warn.push(`leitura das 17h com ${fmt(x.mm17)} mm, mas manhã e tarde marcadas como "Não choveu"`);
 if(x.shift==='noite'&&+x.mm07>0&&x.rainP[2]===false)warn.push(`leitura das 07h com ${fmt(x.mm07)} mm, mas a noite está marcada como "Não choveu"`);
 // parada por chuva sem chuva marcada
 if(x.wstops.some(p=>p.t==='c')&&!ownP(x).some(i=>x.rainP[i]===true))warn.push('tem parada por chuva, mas nenhum período marcado como "Choveu"');
 if(block.length){$('finmsg').innerHTML=`<p class="alert err">Falta preencher: ${esc(block.join(', '))}.</p>`;note('Falta preencher: '+block.join(', ')+'.',true);return {err:'FALTA PREENCHER'};}
 // avisos (não bloqueiam): na primeira arrastada só mostra; arrastar de novo confirma
 let wk=warn.join('|');if(warn.length&&finalize.ack!==day+wk){finalize.ack=day+wk;$('finmsg').innerHTML=`<div class="alert">Confira antes de finalizar (arraste de novo para enviar assim mesmo):<ul>${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;return {err:'CONFIRA OS AVISOS'};}
 refreshWorkers();let rev=x.revs.length;x.finalized={at:new Date().toISOString(),rev};x.revs.push({rev,at:x.finalized.at});touch(day);save();return {ok:true};
}
// Arrastou até o fim: finaliza, gera os arquivos e envia (o botão gira enquanto envia, fica verde ou vermelho)
async function finalizeSend(){let d=day,r=finalize();if(!r||!r.ok)return r||{err:'FALHA AO ENVIAR'};
 try{await uploadRdo(d,await rdoFiles(d,true));bkSchedule(true);return {ok:true,after:()=>{keepScroll(render);note('RDO enviado para a pasta do RDO do site. Pronto!');}};}
 catch(e){console.warn(e);return {err:'FALHA AO ENVIAR',after:()=>{keepScroll(render);note('Não deu para enviar agora ('+e.message+'). O RDO ficou salvo e é reenviado sozinho quando a internet voltar.',true);}};}}
// Botão de arrastar (port em JavaScript puro do SlideCommit: mola na volta, tremida no erro, giro enquanto envia)
function slideCommit(root,onConfirm){const t=root.querySelector('.sc-t'),cap=root.querySelector('.sc-c'),lab=root.querySelector('.sc-x'),err=root.querySelector('.sc-e'),PAD=4,G=48;
 let x=0,v=0,raf=0,target=null,bounce=0,phase='idle',grip=null,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const T=()=>Math.max(1,t.clientWidth-PAD*2-G);
 const draw=()=>{let tr=T(),q=Math.max(0,Math.min(x,tr));cap.style.width=(G+q)+'px';lab.style.opacity=phase==='error'?1:Math.max(0,1-q/(tr*.55));cap.setAttribute('aria-valuenow',Math.round(q/tr*100));};
 const spring=(to,b,done)=>{cancelAnimationFrame(raf);if(reduce){x=to;draw();done&&done();return;}target=to;bounce=b;let k=580,c=2*Math.sqrt(k*.9)*(1-b),last=performance.now();
  const step=now=>{let dt=Math.min(.032,(now-last)/1000);last=now;let a=(-k*(x-target)-c*v)/.9;v+=a*dt;x+=v*dt;draw();if(Math.abs(x-target)<.4&&Math.abs(v)<4){x=target;v=0;draw();done&&done();return;}raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);};
 const shake=()=>{if(reduce)return;let seq=[0,-6,6,-4,4,-1,0],i=0;const f=()=>{t.style.transform=`translateX(${seq[i]}px)`;if(++i<seq.length)setTimeout(f,55);else t.style.transform='';};f();};
 const set=p=>{phase=p;root.dataset.p=p;};
 async function commit(){x=T();draw();set('pending');let t0=performance.now(),r;
  try{r=await onConfirm();}catch(e){r={err:'FALHA AO ENVIAR'};}
  await new Promise(z=>setTimeout(z,Math.max(0,350-(performance.now()-t0))));
  if(r&&r.ok){set('done');x=T();draw();setTimeout(()=>r.after&&r.after(),1300);return;}
  err.textContent=(r&&r.err)||'FALHA AO ENVIAR';set('error');shake();setTimeout(()=>spring(0,.38),250);
  setTimeout(()=>{if(r&&r.after)r.after();else if(phase==='error')set('idle');draw();},1700);}
 t.addEventListener('pointerdown',e=>{if(grip||phase==='pending'||phase==='done'||(e.button!=null&&e.button!==0))return;cancelAnimationFrame(raf);if(phase==='error')set('idle');
  let rect=t.getBoundingClientRect(),at=e.clientX-rect.left-PAD-G/2;grip={id:e.pointerId,off:at<=x+G?at-x:G/2,moved:false};root.classList.add('held');try{t.setPointerCapture(e.pointerId);}catch(_){}});
 t.addEventListener('pointermove',e=>{if(!grip||e.pointerId!==grip.id)return;let rect=t.getBoundingClientRect(),n=Math.max(0,Math.min(T(),e.clientX-rect.left-PAD-G/2-grip.off));if(Math.abs(n-x)>.5)grip.moved=true;x=n;draw();});
 const up=e=>{if(!grip||e.pointerId!==grip.id)return;grip=null;root.classList.remove('held');try{t.releasePointerCapture(e.pointerId);}catch(_){}if(x>=T()-2)commit();else spring(0,.38);};
 t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
 cap.addEventListener('keydown',e=>{if(phase==='pending'||phase==='done')return;if(e.key==='End'||e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='ArrowRight'){e.preventDefault();x=Math.min(T(),x+T()/10);draw();if(x>=T())commit();}else if(e.key==='ArrowLeft'||e.key==='Home'||e.key==='Escape'){e.preventDefault();x=e.key==='ArrowLeft'?Math.max(0,x-T()/10):0;draw();}});
 addEventListener('resize',draw);set('idle');draw();}

function sheets(){let out={pluviometria:[],paralisacoes:[],maoDeObra:[],maoDeObraTerceiros:[],atividades:[]};
 for(let [d,x] of Object.entries(db.days).sort()){let w=win(d,x.shift),acts=listActs(d),gs=gridStats(d),m=assign(d),base={data:d,apontador:x.author||'',turno:x.shift,frente:x.front||''};

  for(let p of x.stops){let a=acts.find(k=>k.key===p.act),c=crewOf(x,p.crew),crs=p.crew==='all'?(a?.crews||[]).map(k=>crewOf(x,k.id)).filter(Boolean):c?[c]:[];
   out.paralisacoes.push({...base,inicio:hm(p.sm),fim:hm(p.em,true),horas:(p.em-p.sm)/60,atividade:a?(a.kind==='3d'?a.label:a.label):'',servico:a?.kind==='3d'?a.sub:'Atividade extra',tipoAtividade:a?.kind==='3d'?'3D':'Extra',encarregados:crs.map(k=>title(k.fid)),pessoas:p.crew==='all'?(m.get(p.act)||[]).length:(m.get(p.act)||[]).filter(w=>w.crew===c?.fid).length,tipoMotivo:p.type,motivo:p.desc});}
  for(let c of x.crews){let F=foreman(c.fid);out.maoDeObra.push({...base,encarregado:title(F.n),cargo:title(F.c),funcao:title(F.c),quantidade:1});for(let [f,n] of Object.entries(c.counts))if(+n)out.maoDeObra.push({...base,encarregado:title(F.n),cargo:title(F.c),funcao:title(f),quantidade:+n});}
  for(let c of x.tcrews||[]){out.maoDeObraTerceiros.push({...base,empresa:empName(c.emp),encarregado:title(c.fid),matricula:c.enc,funcao:'Encarregado',quantidade:1});for(let [f,n] of Object.entries(c.counts||{}))if(+n)out.maoDeObraTerceiros.push({...base,empresa:empName(c.emp),encarregado:title(c.fid),matricula:c.enc,funcao:title(f),quantidade:+n,matriculas:(c.pres||[]).filter(q=>q.f===f).map(q=>q.m)});}
  for(let a of acts)out.atividades.push({...base,equipe:a.terc?'Terceiros':'Alya',tipo:a.kind==='3d'?'3D':'Extra',atividade:a.label,servico:a.kind==='3d'?a.sub:'',situacao:a.kind==='3d'?a.status:'',inicio:hm(a.sm),fim:hm(a.em,true),encarregados:a.crews.map(k=>crewOf(x,k.id)).filter(Boolean).map(k=>title(k.fid)),pessoas:(m.get(a.key)||[]).length,horasHomem:(m.get(a.key)||[]).reduce((s,w2)=>s+w2.hours,0),concretoM3:a.concrete??null,fotos:photoCount(x,a.key)});}
 return out;}

// Envio do RDO (V1.60): os arquivos vão direto para a "Pasta do RDO" do site, sem OneDrive nem outro aplicativo.
// O 3D, a pluviometria e as paralisações leem o pacote dessa pasta sozinhos. Sem internet, o RDO fica pendente e é

// pendentes: reenviados quando a internet volta (e ao abrir o RDO)
let retrying=false;

 for(let d of L){try{await uploadRdo(d,await rdoFiles(d,true));ok++;}catch(e){console.warn('reenvio',d,e);break;}}
 retrying=false;if(ok){note(ok===1?'RDO pendente enviado para a pasta do site.':ok+' RDOs pendentes enviados para a pasta do site.');try{render();}catch(e){}}}
addEventListener('online',()=>setTimeout(retryPending,1500));setTimeout(retryPending,4000);
// Versão nova do RDO: o app confere sozinho quando volta para a tela e se atualiza (os dados ficam no aparelho).
const RDO_VER='1.91';

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVer();});setInterval(()=>{if(document.visibilityState==='visible')checkVer();},20*60e3);setTimeout(checkVer,8000);

 for(let [k,g] of groups){let a=st.acts.find(z=>z.key===k),urls=[];for(let id of g.items.slice(0,6)){let bl=await getPhoto(id);if(bl)urls.push(await blobURL(bl));}if(!urls.length)continue;
  doc.addPage();header();section('Anexo · Registro fotográfico',0);
  let crs=[...g.crews].map(id=>crewOf(x,id)).filter(Boolean).map(c=>title(c.fid)).join(', ')||'—';
  doc.rect(M,y,W,40,{fill:'#fbf7ec',stroke:LINE,lw:.6});doc.rect(M,y,4,40,{fill:AMB});
  doc.text(M+12,y+6,doc.wrap(a?(a.kind==='3d'?a.label+' · '+a.sub:'Atividade extra · '+a.label):'Atividade',11,true,W-24)[0],{size:11,bold:true,color:INK});
  doc.text(M+12,y+23,doc.wrap(`${a?span(a.sm,a.em):''} · ${a?.kind==='3d'?(a.place?a.place+' · ':'')+a.status+' · ':''}Encarregado: ${crs} · ${urls.length} foto${urls.length>1?'s':''}`,8,false,W-24)[0],{size:8,color:MUTE});
  y+=48;const pw=(W-12)/2,BH=Math.min(200,(doc.H-48-y-3*16)/3);
  for(let i=0;i<urls.length;i++){let col=i%2,row=Math.floor(i/2),bx=M+col*(pw+12),by=y+row*(BH+16),u=urls[i],sz=await imgSize(u),sc=Math.min(pw/sz.w,BH/sz.h),iw=sz.w*sc,ih=sz.h*sc;
   doc.rect(bx,by,pw,BH,{fill:SOFT,stroke:LINE,lw:.5});doc.image(u,bx+(pw-iw)/2,by+(BH-ih)/2,iw,ih);doc.text(bx,by+BH+3,'Foto '+(i+1)+' de '+urls.length,{size:7,color:MUTE});}
  y+=Math.ceil(urls.length/2)*(BH+16);
  }
 let n=doc.pages.length;doc.pages.forEach((p,i)=>{doc.cur=p;footer(i+1,n);});
 return doc.output();
}

// ---------- Receber ----------
function mergePkg(o,name){
 if(o?.schema==='alya-catalogo-1'){if(!Array.isArray(o.pieces)||!o.pieces.length)throw Error(name+': catálogo vazio.');db.catalog=o;catalog=o;indexCatalog();return name+': catálogo com '+o.pieces.length+' peças carregado';}
 if(o?.schema!=='alya-rdo-pacote-1'||!Array.isArray(o.events))throw Error(name+': não é um arquivo do RDO nem catálogo do 3D.');
 for(let e of o.events)if(!e||typeof e.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!e.uid||!e.service||!ALLSTATUS.includes(e.status))throw Error(name+': atividade inválida. Nada foi importado.');
 let add=0,upd=0;
 for(let e of o.events){let i=db.events.findIndex(k=>k.id===e.id);if(i<0){db.events.push(e);add++;}else if(String(e.updated||e.created)>String(db.events[i].updated||db.events[i].created)){db.events[i]=e;upd++;}}
 for(let [k,v] of Object.entries(o.days||{}))if(!db.days[k])db.days[k]=v;
 return name+': '+add+' novas'+(upd?', '+upd+' atualizadas':'')+(o.from?' de '+o.from:'');
}
$('file').onchange=async()=>{let out=[];for(let f of [...$('file').files]){try{out.push(mergePkg(JSON.parse(await f.text()),f.name));}catch(e){out.push(e.message);}}$('file').value='';save();render();note(out.join(' · '),out.some(t=>/inválid|não é/.test(t)));};

// Barra de baixo (Hoje · Em aberto · Enviar) no iPhone com iOS 26, no Safari e no navegador do WhatsApp: depois que o
// teclado fecha, o iOS pode ficar com a tela "encolhida" (WebKit 297779): a barra fixa para no meio da tela e o
// innerHeight/visualViewport continuam com a altura de quando o teclado estava aberto.
// 1) Cura: quando a altura fica muito menor que a maior já vista (sem teclado aberto), esconde e mostra a página
//    numa só passada (sem piscar); isso faz o WebKit medir a tela de novo (mesma técnica usada em PWAs no iOS).
// 2) A barra some enquanto o teclado está aberto. (A V0.13 também empurrava a barra pela altura do visualViewport, mas
//    no iOS 26 essa altura fica errada depois do teclado e a barra subia para o meio da tela; isso foi retirado.)
// Com ?vp no endereço aparece um quadrinho com as medidas, para diagnóstico.
(function(){const vv=window.visualViewport,bar=$('tabs');if(!bar)return;
 const lay=document.createElement('div');lay.setAttribute('aria-hidden','true');lay.style.cssText='position:fixed;top:0;left:0;width:0;height:100%;visibility:hidden;pointer-events:none';document.body.appendChild(lay);
 const typing=()=>{let a=document.activeElement;return !!a&&(a.tagName==='TEXTAREA'||a.isContentEditable||(a.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|reset|file|range|color|image)$/i.test(a.type||'')));};
 const hs=()=>[innerHeight,vv?vv.height:innerHeight,lay.getBoundingClientRect().height],curH=()=>Math.max(...hs());
 let maxH=curH(),lastW=innerWidth,heals=0,lastHeal=0,raf=0,dbg=null;
 function heal(force){if(typing())return;if(innerWidth!==lastW){lastW=innerWidth;maxH=curH();return;}
  maxH=Math.max(maxH,curH());if(maxH-Math.min(...hs())<150||(!force&&Date.now()-lastHeal<1500))return;
  lastHeal=Date.now();heals++;let y=scrollY,b=document.body;b.style.display='none';void b.offsetHeight;b.style.display='';scrollTo(0,y);later();}
 function fix(){raf=0;
  if(getComputedStyle(bar).position!=='fixed'){bar.style.transform='';document.body.classList.remove('kb');return show(0);}
  document.body.classList.toggle('kb',typing());bar.style.transform='';show(vv?Math.round(vv.height+vv.offsetTop-lay.getBoundingClientRect().height):0);}
 function show(off){if(!dbg)return;let r=bar.getBoundingClientRect();dbg.textContent=`iH ${innerHeight} · vv ${vv?Math.round(vv.height)+'/'+Math.round(vv.offsetTop):'-'} · lay ${Math.round(lay.getBoundingClientRect().height)} · max ${maxH} · dif ${off} · barra ${Math.round(r.top)}–${Math.round(r.bottom)} · curas ${heals}`;}
 if(/[?&]vp\b/.test(location.search)){dbg=document.createElement('div');dbg.style.cssText='position:fixed;left:6px;top:calc(env(safe-area-inset-top) + 70px);z-index:99;background:#000c;color:#7fffd4;font:11px/1.3 monospace;padding:4px 6px;border-radius:6px;pointer-events:none;max-width:calc(100% - 12px)';document.body.appendChild(dbg);}
 const later=()=>{if(!raf)raf=requestAnimationFrame(fix);};
 const tick=()=>{later();heal(false);};
 if(vv){vv.addEventListener('resize',tick);vv.addEventListener('scroll',later);}
 addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);addEventListener('orientationchange',()=>{setTimeout(()=>{lastW=innerWidth;maxH=curH();later();},400);});
 document.addEventListener('focusin',later);
 document.addEventListener('focusout',()=>{later();setTimeout(()=>{heal(true);fix();},200);setTimeout(()=>{heal(true);fix();},700);});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){later();setTimeout(()=>heal(true),300);}});
 fix();})();
$('thm').onclick=()=>{let l=document.documentElement.classList.toggle('light');try{localStorage.setItem('rdo-tema',l?'claro':'escuro');}catch(e){}};
(function(){let v=document.createElement('p');v.className='ver';v.id='ver';v.textContent=APP+' · Ponte Joinville · Alya Construtora';$('content').after(v);})();
render();
window.__rdo={get db(){return db},buildPdf,mergePkg,pkg,sheets,dayStats,assign,setDay:d=>{day=d;render();}};
