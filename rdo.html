// ---------- Finalizar ----------
function finalize(){
 let x=getDay(),st=dayStats(),block=[],warn=[];
 if(!x.author)block.push('nome do apontador');
 if(ownP(x).some(i=>x.rainP[i]==null))block.push(x.shift==='noite'?'chuva da noite':'chuva da manhã e da tarde');if(x.wstops.some(p=>p.em<=p.sm))block.push('parada por chuva/raio com fim antes do início');
 if(!x.crews.length)block.push('equipes do dia');
 if(!st.acts.length)block.push('pelo menos uma atividade');
 let empty=x.crews.filter(c=>crewTotal(c)===1);if(empty.length)warn.push('equipe sem quantidades: '+empty.map(c=>short(c.fid)).join(', '));
 let idle=x.crews.filter(c=>!st.acts.some(a=>a.crews.some(k=>k.id===c.id)));if(idle.length)warn.push('equipe sem atividade: '+idle.map(c=>short(c.fid)).join(', '));
 if(block.length){$('finmsg').innerHTML=`<p class="alert err">Falta preencher: ${esc(block.join(', '))}.</p>`;note('Falta preencher: '+block.join(', ')+'.',true);return;}
 let b=$('finish');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar: finalizar e gerar PDF';$('finmsg').innerHTML=warn.length?`<div class="alert">Confira antes de finalizar:<ul>${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:'';setTimeout(()=>{if($('finish')){$('finish').dataset.armed='';$('finish').textContent='Finalizar RDO do dia';}},7000);return;}
 refreshWorkers();let rev=x.revs.length;x.finalized={at:new Date().toISOString(),rev};x.revs.push({rev,at:x.finalized.at});touch(day);save();render();shareFiles(day,true);
}
// Dados prontos para as planilhas (pluviometria, paralisações, mão de obra e atividades).
function sheets(){let out={pluviometria:[],paralisacoes:[],maoDeObra:[],atividades:[]};
 for(let [d,x] of Object.entries(db.days).sort()){let w=win(d,x.shift),acts=listActs(d),gs=gridStats(d),m=assign(d),base={data:d,apontador:x.author||'',turno:x.shift,frente:x.front||''};
  if(x.rainP.some(v=>v!=null)||x.mm07!==''||x.mm17!==''||gs.iv.length)out.pluviometria.push({...base,chuvaManha:ownP(x).includes(0)?x.rainP[0]:null,chuvaTarde:ownP(x).includes(1)?x.rainP[1]:null,chuvaNoite:ownP(x).includes(2)?x.rainP[2]:null,mm07:x.mm07===''?null:+x.mm07,mm17:x.mm17===''?null:+x.mm17,horasChuva:gs.c,horasRaio:gs.r,intervalos:gs.iv.map(v=>({tipo:v.t==='c'?'Chuva':'Raio',inicio:hm(v.m),fim:hm(v.e,true),horas:(v.e-v.m)/60})),fotos:[x.ph07?fotoName(d,x,'07'):'',x.ph17?fotoName(d,x,'17'):''].filter(Boolean)});
  for(let p of x.stops){let a=acts.find(k=>k.key===p.act),c=x.crews.find(k=>k.id===p.crew),crs=p.crew==='all'?(a?.crews||[]).map(k=>x.crews.find(z=>z.id===k.id)).filter(Boolean):c?[c]:[];
   out.paralisacoes.push({...base,inicio:hm(p.sm),fim:hm(p.em,true),horas:(p.em-p.sm)/60,atividade:a?(a.kind==='3d'?a.label:a.label):'',servico:a?.kind==='3d'?a.sub:'Atividade extra',tipoAtividade:a?.kind==='3d'?'3D':'Extra',encarregados:crs.map(k=>title(k.fid)),pessoas:p.crew==='all'?(m.get(p.act)||[]).length:(m.get(p.act)||[]).filter(w=>w.crew===c?.fid).length,tipoMotivo:p.type,motivo:p.desc});}
  for(let c of x.crews){let F=foreman(c.fid);out.maoDeObra.push({...base,encarregado:title(F.n),cargo:title(F.c),funcao:title(F.c),quantidade:1});for(let [f,n] of Object.entries(c.counts))if(+n)out.maoDeObra.push({...base,encarregado:title(F.n),cargo:title(F.c),funcao:title(f),quantidade:+n});}
  for(let a of acts)out.atividades.push({...base,tipo:a.kind==='3d'?'3D':'Extra',atividade:a.label,servico:a.kind==='3d'?a.sub:'',situacao:a.kind==='3d'?a.status:'',inicio:hm(a.sm),fim:hm(a.em,true),encarregados:a.crews.map(k=>x.crews.find(z=>z.id===k.id)).filter(Boolean).map(k=>title(k.fid)),pessoas:(m.get(a.key)||[]).length,horasHomem:(m.get(a.key)||[]).reduce((s,w2)=>s+w2.hours,0),concretoM3:a.concrete??null,fotos:photoCount(x,a.key)});}
 return out;}
const fotoName=(d,x,k)=>`PLUV_${d}_${slug(x.author)}_${k}h.jpg`;
function pkg(){for(let d of Object.keys(db.days))refreshWorkers(d);return {schema:'alya-rdo-pacote-1',versao:'0.4',app:APP,from:db.profile||'',device:db.device,exported:new Date().toISOString(),catalog:catalog.generated,days:db.days,events:db.events,...sheets()};}
async function pdfFile(d){let x=getDay(d),f=x.finalized,bytes=await buildPdf(d);return new File([bytes],`RDO_${d}_${slug(x.author)}_${x.shift==='noite'?'Noite':'Dia'}_Rev${f?f.rev:0}.pdf`,{type:'application/pdf'});}
async function photoFiles(d){let x=getDay(d),out=[],acts=listActs(d),n=0;for(let k of ['07','17']){let b=await getPhoto(x['ph'+k]);if(b)out.push(new File([b],fotoName(d,x,k),{type:'image/jpeg'}));}
 for(let g of x.photos){let a=acts.find(k=>k.key===g.act);for(let id of g.items){let b=await getPhoto(id);if(b)out.push(new File([b],`FOTO_${d}_${slug(x.author)}_${String(++n).padStart(2,'0')}_${slug(a?.label||'atividade').slice(0,22)}.jpg`,{type:'image/jpeg'}));}}return out;}
// Envio do RDO (V1.60): os arquivos vão direto para a "Pasta do RDO" do site, sem OneDrive nem outro aplicativo.
// O 3D, a pluviometria e as paralisações leem o pacote dessa pasta sozinhos. Sem internet, o RDO fica pendente e é
// reenviado quando a conexão voltar (ou pelo botão "Enviar" em Dias registrados).
const SITE_FROM='2026-10-23T00:00';
const siteOk=x=>!!(x&&x.finalized&&x.site&&x.site.rev===x.finalized.rev);
const sitePending=()=>Object.entries(db.days).filter(([d,x])=>x.finalized&&String(x.finalized.at)>=SITE_FROM&&!siteOk(x)).map(([d])=>d).sort();
async function rdoFiles(d,withPkg){let list=[];
 if(d){list.push({f:await pdfFile(d),kind:'pdf'});for(let f of await photoFiles(d))list.push({f,kind:/^PLUV_/.test(f.name)?'pluvio':'foto'});}
 if(withPkg){let p=pkg();list.push({f:new File([JSON.stringify(p)],`RDO_${d||today()}_${slug(db.profile)}_3D.txt`,{type:'text/plain'}),kind:'pacote',exported:p.exported});}
 return list;}
async function okJson(r){let j=null;try{if(/json/.test(r.headers.get('content-type')||''))j=await r.json();}catch(e){}if(!r.ok||!j)throw Error(j&&j.error?j.error:r.status===403?'sem permissão (entre de novo no site)':'sem conexão com o site');return j;}
async function uploadRdo(d,list,onp){
 let x=d?getDay(d):null,id=[d||today(),slug(x?x.author:db.profile)||'apontador',x?(x.shift==='noite'?'noite':'dia'):'pacote',x&&x.finalized?'rev'+x.finalized.rev:'',Date.now().toString(36)].filter(Boolean).join('_').replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,140);
 for(let i=0;i<list.length;i++){onp&&onp(i,list.length);let it=list[i];
  await okJson(await fetch('/api/rdo/arquivo/'+encodeURIComponent(id)+'/'+i,{method:'PUT',headers:{'content-type':it.f.type||'application/octet-stream','x-nome':encodeURIComponent(it.f.name)},body:it.f}));}
 onp&&onp(list.length,list.length);
 await okJson(await fetch('/api/rdo/fim/'+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data:d||today(),autor:x?x.author:db.profile,turno:x?x.shift:'',rev:x&&x.finalized?x.finalized.rev:null,app:APP,arquivos:list.map((it,i)=>({n:i,nome:it.f.name,kind:it.kind}))})}));
 let pk=list.find(i=>i.kind==='pacote');if(pk)db.sentAt=pk.exported;if(x&&x.finalized)x.site={rev:x.finalized.rev,at:new Date().toISOString(),id};save();
 return id;}
let sending=false;
async function shareFiles(d,withPkg){
 if(sending)return note('Já tem um envio em andamento.');
 let list;note('Gerando os arquivos…');
 try{list=await rdoFiles(d,withPkg);}catch(e){console.error(e);return note('Não foi possível gerar os arquivos: '+e.message,true);}
 $('notice').classList.remove('on');
 const kb=f=>f.size>1e6?fmt(f.size/1e6)+' MB':Math.max(1,Math.round(f.size/1e3))+' KB';
 sheet('Enviar RDO',d?br(d)+' · '+(getDay(d).author||''):'Pacote completo',0);
 const show=(q,alert,foot)=>{$('sh-body').innerHTML=`<p class="q">${q}</p><div class="flist">${list.map(i=>`<div class="fr"><b style="font-weight:500;word-break:break-all">${esc(i.f.name)}</b><span>${kb(i.f)}</span></div>`).join('')}</div>${alert||''}`;$('sh-foot').innerHTML=foot||'';};
 const go=async()=>{
  sending=true;show('Enviando para a pasta do RDO…','<p class="hint" style="margin-top:12px">Deixe esta tela aberta até terminar.</p>');
  try{await uploadRdo(d,list,(i,n)=>{$('sh-bar').style.width=Math.round(i/n*100)+'%';let q=$('sh-body').querySelector('.q');if(q)q.textContent=i<n?'Enviando '+(i+1)+' de '+n+'…':'Conferindo…';});
   sending=false;closeSheet();note('RDO enviado para a pasta do RDO do site. Pronto!');}
  catch(e){sending=false;console.warn(e);$('sh-bar').style.width='0%';
   show('Não deu para enviar agora',`<p class="alert err" style="margin-top:14px">${esc(e.message)}. ${d?'O RDO continua salvo neste aparelho e é reenviado sozinho quando a internet voltar.':''}</p>`,
    `<button class="btn primary big" type="button" id="go" style="width:100%">Tentar de novo</button><button class="btn big" type="button" id="dl" style="width:100%;margin-top:8px">Baixar os arquivos neste aparelho</button>`);
   $('go').onclick=go;$('dl').onclick=()=>{list.forEach(i=>download(i.f));note('Arquivos baixados.');};}
 };
 go();
}
// pendentes: reenviados quando a internet volta (e ao abrir o RDO)
let retrying=false;
async function retryPending(){if(retrying||sending||!navigator.onLine)return;let L=sitePending();if(!L.length)return;retrying=true;let ok=0;
 for(let d of L){try{await uploadRdo(d,await rdoFiles(d,true));ok++;}catch(e){console.warn('reenvio',d,e);break;}}
 retrying=false;if(ok){note(ok===1?'RDO pendente enviado para a pasta do site.':ok+' RDOs pendentes enviados para a pasta do site.');try{render();}catch(e){}}}
addEventListener('online',()=>setTimeout(retryPending,1500));setTimeout(retryPending,4000);
// Versão nova do RDO: o app confere sozinho quando volta para a tela e se atualiza (os dados ficam no aparelho).
const RDO_VER='1.60';
async function checkVer(){try{if(location.protocol==='file:')return;let r=await fetch('/api/rdo/versao',{cache:'no-store'});if(!r.ok||!/json/.test(r.headers.get('content-type')||''))return;let j=await r.json();
 if(!j||!j.rdo||j.rdo===RDO_VER)return;let k='rdo-ver-'+j.rdo;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}
 if($('sheet').hidden&&!sending&&!retrying){save();location.reload();}else note('Tem uma versão nova do RDO: ela abre quando você fechar esta tela.');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVer();});setInterval(()=>{if(document.visibilityState==='visible')checkVer();},20*60e3);setTimeout(checkVer,8000);
function download(f){let url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function downloadPdf(d){download(await pdfFile(d));}

// ---------- PDF oficial ----------
async function buildPdf(d){
 refreshWorkers(d);
 const doc=new MiniPDF.Doc(),x=getDay(d),st=dayStats(d),w=win(d,x.shift),gs=gridStats(d),fin=x.finalized||{rev:x.revs.length,at:new Date().toISOString()};
 const M=36,W=doc.W-2*M,INK='#14202b',MUTE='#5b6773',LINE='#c9d1d8',HEAD='#1f2b36',AMB='#e3a82b',SOFT='#f2f4f6';
 const num=`${d.replace(/-/g,'')}-${slug(x.author).slice(0,3).toUpperCase()}-${x.shift==='noite'?'N':'D'}`;
 const turno=(x.shift==='noite'?'Noite ':'Dia ')+span(w.a,w.b)+(w.he?' · hora extra':'');
 doc.title=`RDO ${br(d)} · ${x.author}`;
 let y=0;
 const header=()=>{doc.rect(0,0,doc.W,6,{fill:AMB});doc.image(LOGO,M,22,0,34);
  doc.text(M+78,20,'Relatório Diário de Obra',{size:16,bold:true,color:INK});
  doc.text(M+78,39,`${x.author||'Apontador'} · ${br(d)} · turno ${x.shift==='noite'?'noite':'dia'}`,{size:10,bold:true,color:'#7a5a12'});
  doc.text(M+78,52,`${OBRA.nome} · Obra ${OBRA.numero} · ${OBRA.empresa}`,{size:8,color:MUTE});
  doc.rect(doc.W-M-150,18,150,42,{stroke:LINE,lw:.8});
  doc.text(doc.W-M-142,23,'RDO nº',{size:7,color:MUTE});doc.text(doc.W-M-142,32,num,{size:9.5,bold:true,color:INK});
  doc.text(doc.W-M-142,46,`${br(d)} · ${weekday(d)}`,{size:8.5,color:INK});doc.text(doc.W-M-8,23,'Rev. '+fin.rev,{size:8.5,bold:true,color:INK,align:'right'});
  doc.line(M,70,doc.W-M,70,{color:INK,lw:1});y=82;};
 const footer=(i,n)=>{doc.line(M,doc.H-34,doc.W-M,doc.H-34,{color:LINE});doc.text(M,doc.H-28,`${APP} · ${x.author||''} · ${br(d)} · gerado em ${new Date(fin.at).toLocaleString('pt-BR')}`,{size:7,color:MUTE});doc.text(doc.W-M,doc.H-28,`Página ${i} de ${n}`,{size:7,color:MUTE,align:'right'});};
 const need=h=>{if(y+h>doc.H-48){doc.addPage();header();}};
 const section=(t,min=60)=>{need(21+min);doc.rect(M,y,W,17,{fill:HEAD});doc.text(M+7,y+4.5,t,{size:9,bold:true,color:'#ffffff'});y+=21;};
 const cells=(items,cols)=>{let cw=W/cols,rows=Math.ceil(items.length/cols);need(rows*28);items.forEach(([k,v],i)=>{let cx=M+(i%cols)*cw,cy=y+Math.floor(i/cols)*28;doc.rect(cx,cy,cw,28,{stroke:LINE,lw:.6});doc.text(cx+6,cy+4,k,{size:6.8,color:MUTE});let t=doc.wrap(v||'—',9,true,cw-12)[0];doc.text(cx+6,cy+14,t,{size:9,bold:true,color:INK});});y+=rows*28+8;};
 const table=(cols,rows,opt={})=>{const fs=opt.size||8,pad=4,lh=fs*1.25;
  const head=()=>{let lines=cols.map(c=>doc.wrap(c.t,fs-.5,true,c.w*W-2*pad)),h=Math.max(...lines.map(l=>l.length))*lh+2*pad;need(h+lh+2*pad);let cx=M;cols.forEach((c,i)=>{doc.rect(cx,y,c.w*W,h,{fill:SOFT,stroke:LINE,lw:.5});lines[i].forEach((ln,j)=>doc.text(c.align==='right'?cx+c.w*W-pad:cx+pad,y+pad+j*lh,ln,{size:fs-.5,bold:true,color:INK,align:c.align}));cx+=c.w*W;});y+=h;};
  head();
  rows.forEach(r=>{let lines=cols.map((c,i)=>doc.wrap(r.cells[i]??'',fs,!!(c.bold||r.bold),c.w*W-2*pad)),h=Math.max(...lines.map(l=>l.length))*lh+2*pad,sub=r.sub?doc.wrap(r.sub,fs-.5,false,W-2*pad-10):[],sh=sub.length?sub.length*lh+pad:0;
   if(y+h+sh>doc.H-48){doc.addPage();header();head();}
   let cx=M;cols.forEach((c,i)=>{doc.rect(cx,y,c.w*W,h+sh,{stroke:LINE,lw:.5,fill:r.bold?SOFT:null});lines[i].forEach((ln,j)=>doc.text(c.align==='right'?cx+c.w*W-pad:cx+pad,y+pad+j*lh,ln,{size:fs,bold:!!(c.bold||r.bold),color:INK,align:c.align}));cx+=c.w*W;});
   if(sub.length){doc.rect(M,y+h,W,sh,{fill:'#fbf7ec',stroke:LINE,lw:.5});sub.forEach((ln,j)=>doc.text(M+pad+10,y+h+pad/2+j*lh,ln,{size:fs-.5,color:'#6b4f12'}));}
   y+=h+sh;});
  y+=10;};
 const none=t=>{need(20);doc.text(M,y,t,{size:9,color:MUTE});y+=20;};
 header();
 section('1. Identificação');
 cells([['Apontador',x.author],['Data',br(d)+' · '+weekday(d)],['Turno',turno],['Frente de serviço',x.front]],4);
 section('2. Pluviometria',140);
 const yn=v=>v===true?'Choveu':v===false?'Não choveu':'—';
 const pv=i=>ownP(x).includes(i)?yn(x.rainP[i]):'Outro turno';
 cells([['Manhã',pv(0)],['Tarde',pv(1)],['Noite',pv(2)],['Leitura 07:00 · noite/madrugada',x.mm07!==''?fmt(x.mm07)+' mm':'Não medida'],['Leitura 17:00 · 07h às 17h',x.mm17!==''?fmt(x.mm17)+' mm':'Não medida'],['Total do dia',x.mm07!==''||x.mm17!==''?fmt((+x.mm07||0)+(+x.mm17||0))+' mm':'—'],['Horas paradas · chuva',fmtH(gs.c)],['Horas paradas · raio',fmtH(gs.r)]],4);
 if(gs.iv.length)table([{t:'Tipo',w:.2,bold:true},{t:'Início',w:.2},{t:'Fim',w:.2},{t:'Duração',w:.4,align:'right'}],gs.iv.map(v=>({cells:[v.t==='c'?'Chuva':'Raio',hm(v.m),hm(v.e,true),fmtH((v.e-v.m)/60)]})));
 let ph=[];for(let k of ['07','17']){let b=await getPhoto(x['ph'+k]);if(b)ph.push([k,await blobURL(b)]);}
 if(ph.length){const BH=200,pw=(W-12)/2;need(BH+20);for(let i=0;i<ph.length;i++){let [k,u]=ph[i],sz=await imgSize(u),sc=Math.min(pw/sz.w,BH/sz.h),iw=sz.w*sc,ih=sz.h*sc,bx=M+i*(pw+12);
  doc.rect(bx,y,pw,BH,{fill:SOFT,stroke:LINE,lw:.5});doc.image(u,bx+(pw-iw)/2,y+(BH-ih)/2,iw,ih);doc.text(bx,y+BH+4,'Pluviômetro · leitura das '+k+':00',{size:7.5,color:MUTE});}
  y+=BH+20;}
 section('3. Mão de obra');
 if(x.crews.length){table([{t:'Encarregado',w:.32,bold:true},{t:'Funções e quantidades',w:.56},{t:'Efetivo',w:.12,align:'right'}],x.crews.map(c=>{let F=foreman(c.fid);return {cells:[title(F.n)+'\n'+title(F.c),Object.entries(c.counts).filter(([,n])=>+n).map(([f,n])=>title(f)+' '+n).join(' · ')||'—',String(crewTotal(c))]};}).concat([{cells:['Total','',String(st.efetivo)],bold:true}]));
  let roles=new Map;for(let c of x.crews){let F=foreman(c.fid);roles.set(title(F.c),(roles.get(title(F.c))||0)+1);for(let [f,n] of Object.entries(c.counts))if(+n)roles.set(title(f),(roles.get(title(f))||0)+(+n));}
  let hhRole=new Map;for(let p of st.people)hhRole.set(p.role,(hhRole.get(p.role)||0)+p.h);
  table([{t:'Função',w:.5,bold:true},{t:'Pessoas',w:.25,align:'right'},{t:'Horas-homem',w:.25,align:'right'}],[...roles.entries()].sort((a,b)=>b[1]-a[1]).map(([r,n])=>({cells:[r,String(n),fmt(hhRole.get(r)||0)]})).concat([{cells:['Total',String(st.efetivo),fmt(st.hh)],bold:true}]));}
 else none('Nenhuma equipe lançada.');
 section('4. Atividades');
 let a3=st.acts.filter(a=>a.kind==='3d'),ax=st.acts.filter(a=>a.kind==='extra');
 const crewNames=a=>a.crews.map(k=>x.crews.find(z=>z.id===k.id)).filter(Boolean).map(k=>short(k.fid)).join(', ')||'—';
 if(a3.length)table([{t:'#',w:.04},{t:'Peça / local',w:.25,bold:true},{t:'Serviço',w:.15},{t:'Situação',w:.11},{t:'Horário',w:.12},{t:'Equipes',w:.15},{t:'Efetivo',w:.07,align:'right'},{t:'Concreto',w:.11,align:'right'}],
  a3.map((a,i)=>({cells:[String(i+1),a.label+(a.place?'\n'+a.place:''),a.sub,a.status,span(a.sm,a.em),crewNames(a),String((st.assign.get(a.key)||[]).length),a.concrete!=null?fmt(a.concrete,2)+' m³':'—'],sub:a.desc?'Obs.: '+a.desc:''})));
 else none('Nenhuma atividade do 3D.');
 if(ax.length){need(30);doc.text(M,y,'Atividades extras (fora do escopo do 3D)',{size:9,bold:true,color:INK});y+=14;
  table([{t:'#',w:.04},{t:'Atividade',w:.4,bold:true},{t:'Horário',w:.14},{t:'Equipes',w:.2},{t:'Efetivo',w:.1,align:'right'},{t:'Concreto',w:.12,align:'right'}],ax.map((a,i)=>({cells:[String(i+1),a.label,span(a.sm,a.em),crewNames(a),String((st.assign.get(a.key)||[]).length),a.concrete!=null?fmt(a.concrete,2)+' m³':'—'],sub:a.desc?'Obs.: '+a.desc:''})));}
 if(st.concrete){need(16);doc.text(M,y,`Concreto aplicado no dia: ${fmt(st.concrete,2)} m³`,{size:9,bold:true,color:INK});y+=18;}
 section('5. Paralisações');
 if(x.stops.length)table([{t:'#',w:.04},{t:'Horário',w:.13},{t:'Duração',w:.08,align:'right'},{t:'Atividade',w:.25,bold:true},{t:'Equipe',w:.17},{t:'Tipo do motivo',w:.33}],
  [...x.stops].sort((p,q)=>p.sm-q.sm).map((p,i)=>{let a=st.acts.find(k=>k.key===p.act),c=p.crew==='all'?'Todas da atividade':short(x.crews.find(k=>k.id===p.crew)?.fid||'');return {cells:[String(i+1),span(p.sm,p.em),fmtH((p.em-p.sm)/60),actName(a),c,p.type],sub:'Motivo: '+p.desc};}));
 else none('Sem paralisações no dia.');
 section('6. Equipamentos na frente');
 let eq=EQUIP.filter(t=>count(x.equipment[t]));
 if(eq.length)table([{t:'Equipamento',w:.35,bold:true},{t:'Identificação',w:.5},{t:'Qtd.',w:.15,align:'right'}],eq.map(t=>({cells:[t,x.equipment[t],String(count(x.equipment[t]))]})));
 else none('Nenhum equipamento informado.');
 section('7. Observações e ocorrências',40);
 let lines=doc.wrap(x.notes||'Sem observações.',9,false,W-12);need(lines.length*12+14);doc.rect(M,y,W,lines.length*12+12,{stroke:LINE,lw:.6});lines.forEach((l,i)=>doc.text(M+6,y+6+i*12,l,{size:9,color:x.notes?INK:MUTE}));y+=lines.length*12+24;
 need(80);y=Math.max(y,doc.H-140);let sw=(W-30)/2;
 [[x.author,'Apontador'],['','Responsável pela frente']].forEach(([n,r],i)=>{let cx=M+i*(sw+30);doc.line(cx,y+40,cx+sw,y+40,{color:INK,lw:.8});doc.text(cx,y+45,n||' ',{size:9,bold:true,color:INK});doc.text(cx,y+57,r,{size:8,color:MUTE});});
 // Anexo · Registro fotográfico: uma folha por atividade, com até 6 fotos (2 por linha).
 let byAct=new Map;for(let g of x.photos){if(!byAct.has(g.act))byAct.set(g.act,{crews:new Set,items:[]});let e=byAct.get(g.act);if(g.crew)e.crews.add(g.crew);e.items.push(...g.items);}
 let order=new Map(st.acts.map((a,i)=>[a.key,i])),groups=[...byAct.entries()].sort((p,q)=>(order.get(p[0])??99)-(order.get(q[0])??99));
 if(!groups.length){}
 for(let [k,g] of groups){let a=st.acts.find(z=>z.key===k),urls=[];for(let id of g.items.slice(0,6)){let bl=await getPhoto(id);if(bl)urls.push(await blobURL(bl));}if(!urls.length)continue;
  doc.addPage();header();section('Anexo · Registro fotográfico',0);
  let crs=[...g.crews].map(id=>x.crews.find(z=>z.id===id)).filter(Boolean).map(c=>title(c.fid)).join(', ')||'—';
  doc.rect(M,y,W,40,{fill:'#fbf7ec',stroke:LINE,lw:.6});doc.rect(M,y,4,40,{fill:AMB});
  doc.text(M+12,y+6,doc.wrap(a?(a.kind==='3d'?a.label+' · '+a.sub:'Atividade extra · '+a.label):'Atividade',11,true,W-24)[0],{size:11,bold:true,color:INK});
  doc.text(M+12,y+23,doc.wrap(`${a?span(a.sm,a.em):''} · ${a?.kind==='3d'?(a.place?a.place+' · ':'')+a.status+' · ':''}Encarregado: ${crs} · ${urls.length} foto${urls.length>1?'s':''}`,8,false,W-24)[0],{size:8,color:MUTE});
  y+=48;const pw=(W-12)/2,BH=Math.min(200,(doc.H-48-y-3*16)/3);
  for(let i=0;i<urls.length;i++){let col=i%2,row=Math.floor(i/2),bx=M+col*(pw+12),by=y+row*(BH+16),u=urls[i],sz=await imgSize(u),sc=Math.min(pw/sz.w,BH/sz.h),iw=sz.w*sc,ih=sz.h*sc;
   doc.rect(bx,by,pw,BH,{fill:SOFT,stroke:LINE,lw:.5});doc.image(u,bx+(pw-iw)/2,by+(BH-ih)/2,iw,ih);doc.text(bx,by+BH+3,'Foto '+(i+1)+' de '+urls.length,{size:7,color:MUTE});}
  y+=Math.ceil(urls.length/2)*(BH+16);
  }
 let n=doc.pages.length;doc.pages.forEach((p,i)=>{doc.cur=p;footer(i+1,n);});
 return doc.output();
}

// ---------- Receber ----------
function mergePkg(o,name){
 if(o?.schema==='alya-catalogo-1'){if(!Array.isArray(o.pieces)||!o.pieces.length)throw Error(name+': catálogo vazio.');db.catalog=o;catalog=o;indexCatalog();return name+': catálogo com '+o.pieces.length+' peças carregado';}
 if(o?.schema!=='alya-rdo-pacote-1'||!Array.isArray(o.events))throw Error(name+': não é um arquivo do RDO nem catálogo do 3D.');
 for(let e of o.events)if(!e||typeof e.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!e.uid||!e.service||!ALLSTATUS.includes(e.status))throw Error(name+': atividade inválida. Nada foi importado.');
 let add=0,upd=0;
 for(let e of o.events){let i=db.events.findIndex(k=>k.id===e.id);if(i<0){db.events.push(e);add++;}else if(String(e.updated||e.created)>String(db.events[i].updated||db.events[i].created)){db.events[i]=e;upd++;}}
 for(let [k,v] of Object.entries(o.days||{}))if(!db.days[k])db.days[k]=v;
 return name+': '+add+' novas'+(upd?', '+upd+' atualizadas':'')+(o.from?' de '+o.from:'');
}
$('file').onchange=async()=>{let out=[];for(let f of [...$('file').files]){try{out.push(mergePkg(JSON.parse(await f.text()),f.name));}catch(e){out.push(e.message);}}$('file').value='';save();render();note(out.join(' · '),out.some(t=>/inválid|não é/.test(t)));};

render();
window.__rdo={get db(){return db},buildPdf,mergePkg,pkg,sheets,dayStats,assign,setDay:d=>{day=d;render();}};
