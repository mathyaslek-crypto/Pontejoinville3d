<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>RDO Alya · Ponte Joinville</title><script>/* polyfill */(function(){try{var at=function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;return this[n];};if(!Array.prototype.at)Object.defineProperty(Array.prototype,'at',{value:at,writable:true,configurable:true});if(!String.prototype.at)Object.defineProperty(String.prototype,'at',{value:at,writable:true,configurable:true});if(typeof structuredClone!=='function')window.structuredClone=function(v){return v===undefined?v:JSON.parse(JSON.stringify(v));};}catch(e){}window.addEventListener('error',function(e){var n=document.getElementById('notice');if(n){n.textContent='Erro ao abrir o RDO: '+(e.message||'desconhecido');n.className='on err';}});})();</script>
<style>
:root{--bg:#0e141a;--panel:#141c24;--raise:#1a242e;--line:#22303b;--line2:#304150;--ink:#e8edf2;--muted:#8a99a8;--amber:#f2b33d;--amber2:#ffd27a;--green:#3fb37f;--red:#e0675c;--rain:#3d9be9;--bolt:#b38cff;--f:Bahnschrift,"DIN Alternate","Segoe UI Variable Text","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#0b1117f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top img{height:30px;border-radius:2px}
header.top .t{flex:1;min-width:0}
header.top strong{display:block;font-size:15px;font-weight:600}
header.top small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.sync.pending{background:#2a2412;border-color:#6b5520;color:#f6dc9a}
nav.tabs{display:flex;max-width:760px;margin:14px auto 0;padding:0 16px}
nav.tabs button{flex:1;min-height:42px;border:1px solid var(--line2);background:var(--raise);color:#b8c4cf;font-size:14px;cursor:pointer}
nav.tabs button+button{border-left:0}
nav.tabs button:first-child{border-radius:8px 0 0 8px}
nav.tabs button:last-child{border-radius:0 8px 8px 0}
nav.tabs button[aria-current=page]{background:var(--amber);color:#18140a;border-color:var(--amber);font-weight:600}
nav.tabs .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:#0003;font-size:11px}
main{max-width:760px;margin:0 auto;padding:14px 16px 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:16px 0 8px;color:#c9d3dc;letter-spacing:.02em}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font-size:16px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a99a8 50%),linear-gradient(135deg,#8a99a8 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{color-scheme:dark}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px #f2b33d26}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:#d3dbe3;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#18140a;font-weight:600}
.btn.go{background:var(--green);border-color:var(--green);color:#06150e;font-weight:600}
.btn.big{width:100%;min-height:56px;font-size:16.5px}
.btn.ghost{background:transparent}
.btn.danger{color:#f3a49c;border-color:#5a2f2c;background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.dash{border-style:dashed;background:transparent;color:#cfd8e1;width:100%}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--raise)}
.seg button{flex:1;min-height:46px;padding:4px 6px;border:0;background:transparent;color:#b8c4cf;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button small{font-size:11.5px;opacity:.8}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--amber);color:#18140a;font-weight:600}
.seg.status button[data-v="Concluído"][aria-pressed=true]{background:var(--green);color:#06150e}
/* Dia */
.day{display:flex;align-items:center;gap:10px}
.day .nav{width:46px;flex-shrink:0;padding:0;font-size:20px}
.day .d{flex:1;text-align:center;min-width:0}
.day .d b{display:block;font-size:18px;font-weight:600}
.day .d span{font-size:12.5px;color:var(--muted)}
.he{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:#3a2a10;color:var(--amber2);margin-left:6px;vertical-align:1px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.steps a{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel);text-align:center;min-width:0}
.steps a b{font-size:13px;color:#c9d3dc;font-weight:600}
.steps a.ok{border-color:#2b6047;background:#12241c;color:#8fdcb6}
.steps a.ok b{color:#d8f5e6}
.steps a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:#13281f;border:1px solid #2b6047;color:#a9e7c7;margin-bottom:12px;flex-wrap:wrap}
.final div{flex:1;font-size:13.5px;min-width:180px}
.final b{display:block;font-size:15px;color:#d8f5e6}
/* Seções numeradas */
.sec{scroll-margin-top:70px}
.sh{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
.sh .ix{font-size:12px;font-weight:700;letter-spacing:.06em;color:#18140a;background:var(--amber);border-radius:6px;padding:3px 7px}
.sh h2{margin:0;flex:1;font-size:16.5px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:12px;background:#22303d;color:#c6d0da;white-space:nowrap}
.pill.ok{background:#13281f;color:#8fdcb6}
.pill.warn{background:#2a2412;color:#f6dc9a}
/* Pluviômetro */
.wx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wx .p{border:1px solid var(--line2);border-radius:10px;padding:10px 8px 8px;background:var(--raise);text-align:center}
.wx .p > b{display:block;font-size:13px;margin-bottom:8px}
.wx .p > b small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.wx .opt{display:flex;gap:6px}
.wx .opt button{flex:1;min-height:52px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:#b8c4cf;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;padding:4px 2px}
.wx .opt button[data-v="1"][aria-pressed=true]{background:#15324d;border-color:var(--rain);color:#cfe7ff}
.wx .opt button[data-v="0"][aria-pressed=true]{background:#2a2412;border-color:#8a6a24;color:#f6dc9a}
.reads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rd{border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--raise)}
.rd .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rd .hd b{font-size:20px;font-variant-numeric:tabular-nums}
.rd .hd span{font-size:11.5px;color:var(--muted);text-align:right}
.mm{position:relative;margin-top:8px}
.mm input{font-size:24px;font-weight:600;text-align:center;padding-right:44px;min-height:54px;font-variant-numeric:tabular-nums}
.mm i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px}
.ph{margin-top:8px;display:flex;gap:8px;align-items:center}
.ph label{flex:1;min-height:44px;border-radius:8px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:#cfd8e1;cursor:pointer}
.ph .okt{flex:1;font-size:13px;color:#8fdcb6;min-width:0}
.ph label{min-width:0;flex-direction:column;gap:2px;min-height:54px;font-size:12.5px;padding:4px}
.rmph{width:36px;height:36px;border-radius:8px;border:1px solid #5a2f2c;background:transparent;color:#f3a49c;cursor:pointer;flex-shrink:0}
.wx .p.off{opacity:.45}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp select{padding-left:10px;padding-right:24px;background-position:calc(100% - 14px) 20px,calc(100% - 9px) 20px}
.ws{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--raise);margin-bottom:8px}
.wsh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wsh b{font-size:15px;min-width:24px}
.wsh .seg{flex:1}
.wsh .seg button{min-height:40px;flex-direction:row;gap:6px}
.wsh .seg button[data-wt=c][aria-pressed=true]{background:#15324d;color:#cfe7ff}
.wsh .seg button[data-wt=r][aria-pressed=true]{background:#2a1f45;color:#e6dbff}
.wsh .x{width:40px;height:40px;border-radius:8px;border:1px solid #5a2f2c;background:transparent;color:#f3a49c;cursor:pointer}
.pg{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--raise);margin-bottom:8px}
.pgh{display:flex;align-items:center;gap:10px}
.pgh div{flex:1;min-width:0}
.pgh b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgh span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line2);background:#16202a;display:block}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer}
.thumbs:empty{display:none}
a.btn{text-decoration:none}
.ph label.has{border-style:solid;border-color:#2b6047;color:#8fdcb6;background:#12241c}
.ph img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line2)}
.ph input{display:none}
.tools{display:flex;gap:6px;margin:10px 0 8px}
.tools button{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--raise);color:#c6d0da;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px}
.tools button[aria-pressed=true][data-t=c]{background:#15324d;border-color:var(--rain);color:#cfe7ff}
.tools button[aria-pressed=true][data-t=r]{background:#2a1f45;border-color:var(--bolt);color:#e6dbff}
.tools button[aria-pressed=true][data-t=x]{background:#2a1716;border-color:#7a3a35;color:#f3b4ad}
.tl{display:grid;gap:4px}
.tl .h{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:4px;align-items:center}
.tl .h > button:first-child{min-height:34px;border:0;background:transparent;color:var(--muted);font-size:12.5px;text-align:left;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.tl .cl{min-height:34px;border-radius:6px;border:1px solid var(--line2);background:#16202a;cursor:pointer;padding:0;font-size:10px;color:transparent}
.tl .cl.tc{background:var(--rain);border-color:var(--rain);color:#08243d}
.tl .cl.tr{background:var(--bolt);border-color:var(--bolt);color:#1e1236}
.tl .cl.part{background-image:repeating-linear-gradient(45deg,transparent 0 4px,#ffffff10 4px 8px)}
.tlsum{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tlsum span{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--raise);border:1px solid var(--line2)}
.tlsum span b{font-variant-numeric:tabular-nums}
.tlsum .c{border-color:#24557f;color:#cfe7ff}
.tlsum .r{border-color:#4d3a7a;color:#e6dbff}
/* Equipes */
.crew{border:1px solid var(--line2);border-radius:10px;background:var(--raise);margin-bottom:8px;overflow:hidden}
.crew .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.crew .hd .av{width:34px;height:34px;border-radius:50%;background:#2a2412;color:var(--amber);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.crew .hd .nm{flex:1;min-width:0}
.crew .hd .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .hd .nm span{font-size:11.5px;color:var(--muted)}
.crew .hd .tot{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.crew .hd .tot small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.fn{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid #1d2832}
.fn:first-of-type{border-top:0}
.fn span{flex:1;font-size:14px;min-width:0}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#141d26}
.stp button{width:42px;height:40px;border:0;background:transparent;color:#d3dbe3;font-size:20px;cursor:pointer}
.stp button:disabled{opacity:.3}
.stp b{min-width:34px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.stp.z b{color:var(--muted);font-weight:400}
.crew .ft{display:flex;justify-content:flex-end;padding:6px 8px;border-top:1px solid var(--line)}
/* Atividades e paralisações */
.it{display:grid;grid-template-columns:4px 1fr auto;gap:2px 12px;padding:12px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);margin-bottom:8px;cursor:pointer;text-align:left;width:100%;color:inherit}
.it > i{grid-row:span 3;border-radius:2px;background:var(--amber)}
.it > i.k-ok{background:var(--green)}
.it > i.k-x{background:#6f8fb3}
.it > i.k-s{background:var(--red)}
.it .p{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .st{font-size:12px;font-weight:600;white-space:nowrap;color:#f6dc9a}
.it .st.k-ok{color:#8fdcb6}
.it .st.k-x{color:#a9c1dc}
.it .st.k-s{color:#f3a49c}
.it .sb{font-size:13px;color:#c9d3dc;grid-column:2/-1}
.it .mt{font-size:12px;color:var(--muted);grid-column:2/-1}
.it .cc{color:#9fd3ff}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.empty{color:var(--muted);font-size:13.5px;margin:2px 0 10px;text-align:center;padding:16px 10px;border:1px dashed var(--line2);border-radius:10px}
details.card{padding:0}
details.card>summary{padding:15px 16px;font-size:15px;font-weight:600;cursor:pointer}
details.card>div{padding:0 16px 16px}
.eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.eq small{font-size:11.5px;color:var(--muted)}
/* Folha (passo a passo e formulários) */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0b1117}
#sheet header .ttl{flex:1;min-width:0}
#sheet header b{display:block;font-size:15px}
#sheet header span{font-size:12px;color:var(--muted)}
#sheet .bar{height:3px;background:var(--line)}
#sheet .bar i{display:block;height:100%;background:var(--amber);transition:width .25s}
#sheet .body{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
#sheet footer{display:flex;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b1117;max-width:760px;width:100%;margin:0 auto}
#sheet footer .btn{flex:1}
.q{font-size:19px;font-weight:600;margin:2px 0 12px}
.picker{position:relative}
.picker svg{position:absolute;left:12px;top:23px;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.picker input{padding-left:38px}
.results{margin-top:8px;border:1px solid var(--line2);border-radius:10px;background:#141d26;overflow:hidden}
.results:empty{display:none}
.res{display:grid;grid-template-columns:96px 1fr;column-gap:10px;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer;color:inherit}
.res:first-child{border-top:0}
.res:hover,.res:focus,.res[aria-selected=true]{background:#22303d;outline:none}
.res .k{grid-row:span 2;font-size:11.5px;color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .l{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line2);background:transparent;color:#c6d0da;font-size:13.5px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button[aria-pressed=true]{background:#2a2412;border-color:var(--amber);color:var(--amber2)}
.chosen{padding:12px 14px;border-radius:10px;border:1px solid #6b5520;background:#211c10;margin-bottom:14px}
.chosen .ck{font-size:11.5px;color:var(--amber)}
.chosen .cl{font-size:16px;font-weight:600}
.chosen .ca{font-size:12.5px;color:#c9b98d}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;min-height:62px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);cursor:pointer;text-align:left}
.svc b{font-size:14.5px;font-weight:600}
.svc span{font-size:11.5px;color:var(--muted)}
.svc.done span{color:#7fd4ab}
.svc.open span,.svc.stop span{color:#f2c86a}
.svc[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);background:#2a2412}
.fl{display:grid;gap:6px}
.fopt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;text-align:left;width:100%;color:inherit}
.fopt:hover{border-color:var(--amber)}
.fopt .av{width:36px;height:36px;border-radius:50%;background:#2a2412;color:var(--amber);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.fopt b{display:block;font-size:14.5px}
.fopt span{font-size:12px;color:var(--muted)}
.cs .crew{background:#141d26}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;min-height:50px;border-radius:9px;border:1px solid var(--line2);background:var(--raise);color:#c6d0da;cursor:pointer;font-size:15px}
.toggle button[aria-pressed=true]{background:#15324d;border-color:var(--rain);color:#cfe7ff;font-weight:600}
.toggle button[data-v="0"][aria-pressed=true]{background:#22303d;border-color:#4a5b6b;color:#e8edf2}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.alert{font-size:13.5px;padding:10px 12px;border-radius:8px;background:#2a2412;border:1px solid #6b5520;color:#f6dc9a;margin:12px 0 0}
.alert.err{background:#2a1716;border-color:#7a3a35;color:#f3b4ad}
.alert ul{margin:6px 0 0;padding-left:18px}
.sum{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.sum span{color:var(--muted)}
.days .drow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.days .drow:first-child{border-top:0}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#22303d;color:#c6d0da;white-space:nowrap}
.tag.ok{background:#13281f;color:#8fdcb6}
.flist .fr{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.flist .fr:first-child{border-top:0}
.flist .fr span{color:var(--muted);font-size:12px;text-align:right}
#notice{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;max-width:min(560px,calc(100% - 24px));background:#1b2631;border:1px solid var(--line2);border-radius:10px;padding:11px 15px;font-size:14px;box-shadow:0 12px 30px #0008;transition:.22s;pointer-events:none}
#notice.on{opacity:1;transform:translate(-50%,0)}
#notice.err{border-color:#7a3a35;background:#2a1716}
@media(max-width:720px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:6px 8px max(6px,env(safe-area-inset-bottom));background:#0b1117f5;border-top:1px solid var(--line);backdrop-filter:blur(8px)}
 nav.tabs button,nav.tabs button:first-child,nav.tabs button:last-child{border:0;border-radius:9px;background:transparent;font-size:13px;min-height:50px}
 nav.tabs button[aria-current=page]{background:#2a2412;color:var(--amber)}
 main{padding:12px 12px 130px}
 .eq{grid-template-columns:1fr}
 header.top .sync{display:none}
 .steps a{font-size:10px;padding:7px 3px}
}
@media(max-width:380px){.reads{grid-template-columns:1fr}.wx .opt button{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){#notice,#sheet .bar i{transition:none}}

/* ---------- Tema escuro glass (V0.7): mesmas cores, superfícies translúcidas com desfoque ---------- */
:root{--panel:rgba(20,28,36,.58);--raise:rgba(26,36,46,.52);--line:rgba(140,170,195,.14);--line2:rgba(150,180,205,.2);--glass:blur(18px) saturate(150%);--hi:inset 0 1px 0 rgba(255,255,255,.06)}
html{background:var(--bg)}
body,#sheet{background:radial-gradient(900px 600px at 0% -10%,rgba(242,179,61,.17),transparent 60%),radial-gradient(800px 700px at 110% 30%,rgba(61,155,233,.16),transparent 60%),radial-gradient(700px 600px at 20% 110%,rgba(63,179,127,.1),transparent 60%),var(--bg);background-attachment:fixed}
header.top{background:rgba(11,17,23,.55);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom-color:var(--line)}
.card,.sum{background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--hi),0 12px 32px rgba(0,0,0,.28);border-color:var(--line)}
.crew,.it,.ws,.rd,.pg,.fopt,.svc,.toggle button,.tools button,.seg{box-shadow:var(--hi)}
.results,.stp{background:rgba(20,29,38,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
#sheet header,#sheet footer{background:rgba(11,17,23,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
#notice{background:rgba(27,38,49,.72);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--hi),0 12px 30px rgba(0,0,0,.4)}
.alert{background:rgba(42,36,18,.6)}.final{background:rgba(19,40,31,.62)}.chosen{background:rgba(33,28,16,.6)}
input,select,textarea{background:rgba(26,36,46,.55)}
.btn{box-shadow:var(--hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--panel:#141c24;--raise:#1a242e}header.top,#sheet header,#sheet footer{background:#0b1117f2}}
</style>

const dow=d=>new Date(d+'T12:00:00').getDay();
function win(d,s){let w=dow(d),he=w===6||w===0;if(s==='noite')return w>=1&&w<=4?{a:1080,b:1640,he:false}:{a:1020,b:1440,he};return w>=1&&w<=4?{a:420,b:1020,he:false}:{a:420,b:960,he};}
const hm=(m,end)=>{m=Math.round(m);if(end&&m===1440)return '24:00';let h=Math.floor(m/60)%24;return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const span=(a,b)=>hm(a)+'–'+hm(b,true)+(b>1440?' (+1)':'');
const winLabel=(d,s)=>{let w=win(d,s);return span(w.a,w.b);};
const workH=(a,b)=>{let h=Math.max(0,(b-a)/60);return h>=6?h-1:h;};
function times(w,kind){let out=[];for(let m=w.a;m<w.b;m+=15)out.push(m);out.push(w.b);if(kind==='start')out.pop();if(kind==='end')out.shift();return [...new Set(out)];}
const tp=(id,w,val,dis='')=>{let H=Math.floor(val/60),M=val%60,hs=[];for(let h=Math.floor(w.a/60);h<=Math.floor((w.b-1)/60)+(w.b%60?0:1);h++)hs.push(h);
 return `<div class="tp"><select id="${id}h" aria-label="Hora" ${dis}>${hs.map(h=>`<option value="${h}" ${h===H?'selected':''}>${h===24&&w.b===1440?'24':String(h%24).padStart(2,'0')}h${h>=24&&!(h===24&&w.b===1440)?' (+1)':''}</option>`).join('')}</select><select id="${id}m" aria-label="Minuto" ${dis}>${Array.from({length:60},(_,m)=>`<option value="${m}" ${m===M?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('')}</select></div>`;};

const PDB=new Promise(res=>{try{let r=indexedDB.open('alya-rdo-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});
async function putPhoto(id,blob){let d=await PDB;if(!d)return false;return new Promise(r=>{let t=d.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=()=>r(true);t.onerror=()=>r(false);});}
async function getPhoto(id){if(!id)return null;let d=await PDB;if(!d)return null;return new Promise(r=>{let q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}
const photoURL=new Map;
async function thumb(id){if(!id)return '';if(photoURL.has(id))return photoURL.get(id);let b=await getPhoto(id);if(!b)return '';let u=URL.createObjectURL(b);photoURL.set(id,u);return u;}
async function shrink(file,stamp,max=1280,q=.72){let img;try{img=await createImageBitmap(file);}catch(e){img=await new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
 let s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');g.drawImage(img,0,0,w,h);
 let fs=Math.max(14,Math.round(w/40));g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,h-fs*2.1,w,fs*2.1);g.fillStyle='#fff';g.font=`600 ${fs}px Arial`;g.textBaseline='middle';g.fillText(stamp,fs*.6,h-fs*1.05);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));}

function svcState(u,s){let p=pieceMap.get(u),[cs,ce]=p?.v?.[s]||['',''],evs=live().filter(e=>e.uid===u&&e.service===s).sort((a,b)=>a.date.localeCompare(b.date));
 if(isNA(cs)&&isNA(ce))return {k:'na'};let done=evs.filter(e=>e.status==='Concluído').at(-1)?.date||(ce&&!isNA(ce)?ce:''),start=evs[0]?.date||(cs&&!isNA(cs)?cs:'');
 if(done)return {k:'done',d:done};if(start){let last=evs.at(-1);return {k:'open',d:start,last};}return {k:'todo'};}
const services=u=>{let p=pieceMap.get(u);return p?Object.keys(p.v).filter(s=>svcState(u,s).k!=='na'):[]};
function place(p){return [p.b&&!p.a.includes(p.b)?'Bloco '+p.b:'',p.a,sideName(p.s)].filter(Boolean).join(' · ');}
// Todas as atividades do dia (3D e extras) num formato só.
function listActs(d=day){let x=getDay(d),w=win(d,x.shift);
 let a=dayEvents(d).map(e=>{let p=pieceMap.get(e.uid);return {key:'e:'+e.id,kind:'3d',id:e.id,label:p?.l||e.piece||e.uid,sub:svcLabel(e.service),place:p?place(p):'',status:e.status,sm:e.sm??w.a,em:e.em??w.b,crews:e.crews||[],concrete:e.concrete,desc:e.description||''};});
 let b=x.extras.map(t=>({key:'x:'+t.id,kind:'extra',id:t.id,label:t.desc,sub:'Atividade extra',place:'',status:'Extra',sm:t.sm,em:t.em,crews:t.crews||[],concrete:t.concrete,desc:t.obs||''}));
 return a.concat(b).sort((p,q)=>p.sm-q.sm||p.em-q.em);}
const actName=a=>a?(a.kind==='3d'?a.label+' · '+a.sub:'Extra · '+a.label):'Atividade removida';
// Distribui as pessoas de cada equipe pelas atividades sem contar duas vezes quem trabalhou em horários diferentes.
function assign(d=day){let x=getDay(d),pools=new Map,out=new Map;
 for(let a of listActs(d)){let ws=[],h=workH(a.sm,a.em);
  for(let c of a.crews){let crew=x.crews.find(k=>k.id===c.id);if(!crew)continue;let F=foreman(crew.fid);
   let need=[['__LIDER',1],...Object.entries(crew.counts).map(([f,n])=>[f,Math.min(+n||0,c.counts&&c.counts[f]!=null?+c.counts[f]:+n||0)])];
   for(let [f,n] of need){if(!n)continue;let k=crew.id+'|'+f,pool=pools.get(k)||[];pools.set(k,pool);let got=0;
    for(let i=0;i<pool.length&&got<n;i++)if(pool[i].every(([s,e])=>a.em<=s||a.sm>=e)){pool[i].push([a.sm,a.em]);ws.push(worker(F,f,i,h,a));got++;}
    while(got<n){pool.push([[a.sm,a.em]]);ws.push(worker(F,f,pool.length-1,h,a));got++;}}}
  out.set(a.key,ws);}
 return out;}
const worker=(F,f,i,h,a)=>f==='__LIDER'?{name:title(F.n),role:title(F.c),hours:h,crew:F.n,a:a.sm,b:a.em}:{name:short(F.n)+' · '+title(f)+' '+(i+1),role:title(f),hours:h,crew:F.n,a:a.sm,b:a.em};
function refreshWorkers(d=day){let m=assign(d);for(let e of dayEvents(d))if(e.crews){let ws=m.get('e:'+e.id)||[];e.workers=ws.map(({name,role,hours})=>({name,role,hours}));e.teamName=[...new Set(e.crews.map(c=>getDay(d).crews.find(k=>k.id===c.id)).filter(Boolean).map(c=>title(c.fid)))].join(', ');}return m;}
function dayStats(d=day){let x=getDay(d),m=assign(d),acts=listActs(d),people=new Map;
 for(let ws of m.values())for(let w of ws){let p=people.get(w.name)||{...w,iv:[]};p.iv.push([w.a,w.b]);people.set(w.name,p);}
 let hh=0;for(let p of people.values()){p.iv.sort((a,b)=>a[0]-b[0]);let h=0,cs=-1,ce=-1;const add=()=>{if(ce>cs)h+=workH(cs,ce);};for(let [a,b] of p.iv){if(a>ce){add();cs=a;ce=b;}else ce=Math.max(ce,b);}add();p.h=h;hh+=h;}
 let efetivo=x.crews.reduce((s,c)=>s+crewTotal(c),0),concrete=acts.reduce((s,a)=>s+(a.concrete!=null?+a.concrete:0),0);
 return {acts,people:[...people.values()],hh,efetivo,concrete,assign:m};}
function gridToStops(d,x){let w=win(d,x.shift),out=[],cur=null;for(let m=w.a;m<w.b;m+=15){let t=x.grid[m],e=Math.min(m+15,w.b);if(t){if(cur&&cur.t===t&&cur.em===m)cur.em=e;else{cur={id:uid(),t,sm:m,em:e};out.push(cur);}}else cur=null;}return out;}
function gridStats(d=day){let x=getDay(d),out={c:0,r:0,iv:[]};for(let w2 of [...x.wstops].sort((a,b)=>a.sm-b.sm)){if(!(w2.em>w2.sm))continue;out[w2.t]+=(w2.em-w2.sm)/60;out.iv.push({t:w2.t,m:w2.sm,e:w2.em});}return out;}

let tool='c';

function wsRow(p,i,w,dis){return `<div class="ws" data-ws="${p.id}"><div class="wsh"><b>${i+1}ª</b><div class="seg">${[['c',ICON.rain,'Chuva'],['r',ICON.bolt,'Raio']].map(([k,ic,t])=>`<button type="button" data-wt="${k}" aria-pressed="${p.t===k}" ${dis}>${ic}${t}</button>`).join('')}</div>${dis?'':'<button type="button" class="x" data-wrm aria-label="Excluir parada">✕</button>'}</div>
 <div class="grid2"><label class="f">Início${tp('ws'+p.id+'a',w,p.sm,dis)}</label><label class="f">Fim${tp('ws'+p.id+'b',w,p.em,dis)}</label></div>${p.em<=p.sm?'<p class="alert err" style="margin-top:8px">O fim precisa ser depois do início.</p>':`<p class="hint" style="margin-top:6px">Duração ${fmtH((p.em-p.sm)/60)}</p>`}</div>`;}
function phCard(g,st,dis){let a=st.acts.find(k=>k.key===g.act),c=getDay().crews.find(k=>k.id===g.crew);return `<div class="pg"><div class="pgh"><div><b>${esc(actName(a))}</b><span>${esc(c?title(c.fid):'Sem encarregado')} · ${g.items.length} foto${g.items.length===1?'':'s'}</span></div>${dis?'':`<button class="btn sm" type="button" data-pg="${g.id}">Editar</button>`}</div><div class="thumbs">${g.items.map(id=>`<img data-th="${id}" alt="">`).join('')}</div></div>`;}
function tlRows(d){let cells=grid(d),rows=new Map;for(let c of cells){let h=Math.floor(c.m/60);if(!rows.has(h))rows.set(h,[]);rows.get(h).push(c);}
 return [...rows.entries()].map(([h,cs])=>{let pad=[];let first=cs[0].m%60/15;for(let i=0;i<first;i++)pad.push('<span></span>');return `<div class="h"><button type="button" data-hr="${h}">${String(h%24).padStart(2,'0')}h</button>${pad.join('')}${cs.map(c=>`<button type="button" class="cl${c.t?' t'+c.t:''}${c.e-c.m<15?' part':''}" data-m="${c.m}" aria-label="${hm(c.m)} a ${hm(c.e,true)}${c.t?': '+(c.t==='c'?'chuva':'raio'):''}" aria-pressed="${!!c.t}"></button>`).join('')}</div>`;}).join('');}
function crewCard(c,dis){let F=foreman(c.fid);return `<div class="crew" data-crew="${c.id}"><div class="hd"><span class="av">${initials(F.n)}</span><div class="nm"><b>${esc(title(F.n))}</b><span>${esc(title(F.c))}</span></div><div class="tot">${crewTotal(c)}<small>pessoas</small></div></div>
 ${F.f.map(f=>{let n=+c.counts[f]||0;return `<div class="fn"><span>${esc(title(f))}</span><div class="stp ${n?'':'z'}"><button type="button" data-f="${esc(f)}" data-d="-1" ${dis||(!n?'disabled':'')} aria-label="Menos ${esc(title(f))}">−</button><b>${n}</b><button type="button" data-f="${esc(f)}" data-d="1" ${dis} aria-label="Mais ${esc(title(f))}">+</button></div></div>`;}).join('')}
 ${dis?'':`<div class="ft"><button class="btn sm danger" type="button" data-rmcrew="${c.id}">Remover equipe</button></div>`}</div>`;}
function actCard(a,st){let n=(st.assign.get(a.key)||[]).length,cr=a.crews.map(c=>getDay().crews.find(k=>k.id===c.id)).filter(Boolean).map(c=>short(c.fid)),k=a.kind==='extra'?'k-x':a.status==='Concluído'?'k-ok':'';
 return `<button type="button" class="it" data-act="${a.key}"><i class="${k}"></i><span class="p">${esc(a.label)}</span><span class="st ${k}">${a.kind==='extra'?'Extra':esc(a.status)}</span><span class="sb">${a.kind==='3d'?esc(a.sub)+' · ':''}${span(a.sm,a.em)}${a.concrete!=null?` · <span class="cc">${fmt(a.concrete,2)} m³ concreto</span>`:''}</span><span class="mt">${cr.length?esc(cr.join(', ')):'Sem equipe'} · ${n} pessoa${n===1?'':'s'}${a.desc?' · '+esc(a.desc):''}</span></button>`;}
function stopCard(p,st){let a=st.acts.find(x=>x.key===p.act),c=p.crew==='all'?'Todas as equipes da atividade':short(getDay().crews.find(k=>k.id===p.crew)?.fid||'');
 return `<button type="button" class="it" data-stop="${p.id}"><i class="k-s"></i><span class="p">${esc(p.type)}</span><span class="st k-s">${fmtH((p.em-p.sm)/60)}</span><span class="sb">${span(p.sm,p.em)} · ${esc(actName(a))}</span><span class="mt">${esc(c)}${p.desc?' · '+esc(p.desc):''}</span></button>`;}

  for(let t of x.extras.concat(x.stops,x.wstops)){t.sm=Math.max(w.a,Math.min(t.sm,w.b-15));t.em=Math.min(w.b,Math.max(t.em,t.sm+15));}
  refreshWorkers();touch(day);save();keepScroll(render);note('Turno da '+(x.shift==='noite'?'noite':'manhã')+': '+winLabel(day,x.shift)+'.');});
 document.querySelectorAll('[data-wx]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+g.dataset.wx,v=b.dataset.v==='1';x.rainP[i]=x.rainP[i]===v?null:v;touch(day);save();keepScroll(render);}));
 ['07','17'].forEach(k=>{$('mm'+k).oninput=()=>{let v=$('mm'+k).value;x['mm'+k]=v===''?'':String(Math.max(0,+v));touch(day);save();};$('mm'+k).onchange=()=>keepScroll(render);
});

 document.querySelectorAll('[data-rmph]').forEach(b=>b.onclick=()=>{x['ph'+b.dataset.rmph]='';touch(day);save();keepScroll(render);});
 $('addWs').onclick=()=>{let last=[...x.wstops].sort((a,b)=>a.em-b.em).at(-1),sm=last?Math.min(last.em+30,w.b-30):Math.min(w.a+60,w.b-30);x.wstops.push({id:uid(),t:last?.t||'c',sm,em:Math.min(sm+30,w.b)});touch(day);save();keepScroll(render);};
 document.querySelectorAll('[data-ws]').forEach(box=>{let p=x.wstops.find(k=>k.id===box.dataset.ws);

  box.querySelector('[data-wrm]').onclick=e=>{let b=e.currentTarget;if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='?';setTimeout(()=>{b.dataset.armed='';b.textContent='✕';},2500);return;}x.wstops=x.wstops.filter(k=>k!==p);touch(day);save();keepScroll(render);};

   x.crews=x.crews.filter(k=>k!==c);for(let e of dayEvents(day))if(e.crews){e.crews=e.crews.filter(k=>k.id!==c.id);e.updated=new Date().toISOString();}for(let t of x.extras)t.crews=t.crews.filter(k=>k.id!==c.id);for(let p of x.stops)if(p.crew===c.id)p.crew='all';refreshWorkers();touch(day);save();keepScroll(render);};});

// Seleção de equipes numa atividade (com ajuste opcional de quantas pessoas de cada função).
function crewPicker(state){let x=getDay();if(!x.crews.length)return `<p class="alert">Nenhuma equipe lançada hoje. Adicione o encarregado e as quantidades.</p><button class="btn dash" type="button" id="csAdd" style="margin-top:10px">${ICON.plus}Adicionar equipe</button>`;
 return `<div class="chips" id="csChips">${x.crews.map(c=>`<button type="button" data-cs="${c.id}" aria-pressed="${state.crews.some(k=>k.id===c.id)}">${esc(short(c.fid))} · ${crewTotal(c)}</button>`).join('')}<button type="button" id="csAdd">+ Outra equipe</button></div>
 <div class="cs" style="margin-top:10px">${state.crews.map(sc=>{let c=x.crews.find(k=>k.id===sc.id);if(!c)return '';let F=foreman(c.fid);return `<div class="crew" data-csc="${c.id}"><div class="hd"><span class="av">${initials(F.n)}</span><div class="nm"><b>${esc(title(F.n))}</b><span>${sc.counts?'Parte da equipe nesta atividade':'Equipe inteira nesta atividade'}</span></div></div>${F.f.filter(f=>+c.counts[f]).map(f=>{let max=+c.counts[f],n=sc.counts&&sc.counts[f]!=null?Math.min(+sc.counts[f],max):max;return `<div class="fn"><span>${esc(title(f))} <small class="muted">de ${max}</small></span><div class="stp ${n?'':'z'}"><button type="button" data-cf="${esc(f)}" data-d="-1" ${n?'':'disabled'}>−</button><b>${n}</b><button type="button" data-cf="${esc(f)}" data-d="1" ${n>=max?'disabled':''}>+</button></div></div>`;}).join('')||'<p class="hint" style="padding:0 12px 10px">Equipe sem quantidades. Ajuste em 03 · Equipes.</p>'}</div>`;}).join('')}</div>`;}
function bindCrewPicker(state,redraw){let x=getDay();
 $('csAdd')&&($('csAdd').onclick=()=>{let snap=state;openForemen(c=>{if(c)snap.crews.push({id:c.id,counts:null});redraw();});});
 document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{let id=b.dataset.cs,i=state.crews.findIndex(k=>k.id===id);if(i<0)state.crews.push({id,counts:null});else state.crews.splice(i,1);redraw();});
 document.querySelectorAll('[data-csc]').forEach(box=>{let sc=state.crews.find(k=>k.id===box.dataset.csc),c=x.crews.find(k=>k.id===sc.id);
  box.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{let f=b.dataset.cf;if(!sc.counts)sc.counts={...c.counts};sc.counts[f]=Math.max(0,Math.min(+c.counts[f],(+sc.counts[f]||0)+(+b.dataset.d)));if(Object.keys(c.counts).every(k=>(+sc.counts[k]||0)===(+c.counts[k]||0)))sc.counts=null;redraw();});});}

// ---------- Passo a passo: atividade do 3D ----------
let wz=null;
const STEPS=['Peça','Serviço','Situação e horário','Equipes','Conferir'];
function openWizard(ev,preset){let x=getDay(),w=win(day,x.shift);
 wz=ev?{id:ev.id,uid:ev.uid,service:ev.service,status:ev.status==='Paralisada'?'Em andamento':ev.status,sm:ev.sm??w.a,em:ev.em??w.b,crews:structuredClone(ev.crews||[]),concrete:ev.concrete,hasC:ev.concrete!=null?true:null,description:ev.description,step:4,confirm:false}
  :{step:0,sm:preset?.sm??w.a,em:preset?.em??w.b,crews:structuredClone(preset?.crews||[]),hasC:null,confirm:false};
 drawStep();}
function chosen(p,sv){return `<div class="chosen"><div class="ck">${esc(p.k)}${p.t?' · T'+p.t:''}</div><div class="cl">${esc(p.l)}${sv?' · '+esc(svcLabel(sv)):''}</div><div class="ca">${esc(place(p))}</div></div>`;}
function concreteBlock(st){return `<h3>Teve concreto nesta atividade?</h3><div class="toggle" id="hasC"><button type="button" data-v="0" aria-pressed="${st.hasC===false}">Não</button><button type="button" data-v="1" aria-pressed="${st.hasC===true}">Sim, teve concreto</button></div>${st.hasC?`<label class="f" style="margin-top:10px">Volume aplicado hoje (m³)<div class="mm" style="margin-top:0"><input id="qc" type="number" min="0" step="0.1" inputmode="decimal" value="${st.concrete??''}" placeholder="0,0"><i>m³</i></div></label><p class="hint">Só o aplicado hoje nesta atividade.</p>`:''}`;}
function bindConcrete(st,redraw){document.querySelectorAll('#hasC button').forEach(b=>b.onclick=()=>{keepWz();st.hasC=b.dataset.v==='1';if(!st.hasC)st.concrete=null;redraw();});}
function drawStep(){
 let s=wz.step,p=pieceMap.get(wz.uid),x=getDay(),w=win(day,x.shift);
 sheet(wz.id?'Corrigir atividade':'Atividade do 3D',`Passo ${s+1} de 5 · ${STEPS[s]}`,(s+1)*20);
 let body='',canNext=true;
 if(s===0){body=`<p class="q">Qual peça?</p><div class="picker"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><input id="pq" type="search" autocomplete="off" placeholder="VPM 23, AP05, aduela A12, estaca E-03" aria-label="Buscar peça"></div><div class="results" id="pres" role="listbox"></div>
  ${db.recent.length?`<h3>Usadas recentemente</h3><div class="chips">${db.recent.map(u=>pieceMap.get(u)).filter(Boolean).slice(0,8).map(r=>`<button type="button" data-u="${esc(r.u)}">${esc(r.l)}</button>`).join('')}</div>`:''}
  ${p?`<div class="chosen" style="margin-top:14px"><div class="ck">Selecionada</div><div class="cl">${esc(p.l)}</div><div class="ca">${esc(place(p))}</div></div>`:''}`;canNext=!!p;}
 if(s===1){body=`${chosen(p)}<p class="q">Qual serviço?</p><div class="svcs">${services(p.u).map(sv=>{let st=svcState(p.u,sv),t={done:'Concluído '+br(st.d),open:'Em andamento desde '+br(st.d),todo:'Não iniciado'}[st.k];return `<button type="button" class="svc ${st.k}" data-s="${esc(sv)}" aria-pressed="${wz.service===sv}"><b>${esc(svcLabel(sv))}</b><span>${t}</span></button>`;}).join('')}</div>`;canNext=!!wz.service;}
 if(s===2){let st=svcState(p.u,wz.service);body=`${chosen(p,wz.service)}<p class="q">Como ficou hoje?</p><div class="seg status" id="status">${STATUS.map(v=>`<button type="button" data-v="${v}" aria-pressed="${wz.status===v}">${v}</button>`).join('')}</div>
  ${st.k==='done'?`<p class="alert">Este serviço já consta concluído em ${br(st.d)}.</p>`:''}
  <h3>Horário nesta atividade</h3><div class="grid2"><label class="f">Começou às${tp('t1',w,wz.sm)}</label><label class="f">Terminou às${tp('t2',w,wz.em)}</label></div>
  <p class="hint">Turno ${x.shift==='noite'?'da noite':'do dia'}: ${winLabel(day,x.shift)}. Se a equipe parou no meio, registre em 05 · Paralisações.</p>`;canNext=!!wz.status;}
 if(s===3){body=`${chosen(p,wz.service)}<p class="q">Quais equipes?</p>${crewPicker(wz)}<p class="hint">Toque no encarregado para incluir a equipe. Se só parte dela trabalhou aqui, diminua as quantidades.</p>`;canNext=wz.crews.length>0;}
 if(s===4){let n=assignPreview();
  if(wz.hasC==null&&/^CONCRETAGEM/.test(wz.service))wz.hasC=true;
  body=`<p class="q">Conferir e salvar</p><div class="sum"><span>Peça</span><b>${esc(p.l)}</b><span>Serviço</span><b>${esc(svcLabel(wz.service))}</b><span>Situação</span><b>${esc(wz.status)}</b><span>Horário</span><b>${span(wz.sm,wz.em)}</b><span>Equipes</span><b>${esc(wz.crews.map(c=>short(x.crews.find(k=>k.id===c.id)?.fid||'')).join(', ')||'—')} · ${n} pessoas</b></div>
  ${concreteBlock(wz)}
  <label class="f" style="margin-top:12px">Observação (opcional)<textarea id="desc">${esc(wz.description||'')}</textarea></label>
  <div id="walert"></div>
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" type="button" data-jump="0">Trocar peça</button><button class="btn sm ghost" type="button" data-jump="1">Serviço</button><button class="btn sm ghost" type="button" data-jump="2">Horário</button><button class="btn sm ghost" type="button" data-jump="3">Equipes</button>${wz.id?'<button class="btn sm danger" type="button" id="del">Excluir</button>':''}</div>`;}
 $('sh-body').innerHTML=body;
 $('sh-foot').innerHTML=`<button class="btn" type="button" id="back">${s?'Voltar':'Cancelar'}</button><button class="btn primary" type="button" id="next" ${canNext?'':'disabled'}>${s===4?(wz.id?'Salvar correção':'Salvar atividade'):'Continuar'}</button>`;
 $('back').onclick=()=>{if(!s)return closeSheet();keepWz();wz.step--;drawStep();};
 $('next').onclick=()=>{keepWz();if(s===4)return saveWizard();if(s===2&&wz.em<=wz.sm)return note('O fim precisa ser depois do início.',true);wz.step++;drawStep();};
 bindStep(s);
}
function assignPreview(){let x=getDay(),n=0;for(let sc of wz.crews){let c=x.crews.find(k=>k.id===sc.id);if(!c)continue;n+=1+Object.keys(c.counts).reduce((s,f)=>s+Math.min(+c.counts[f]||0,sc.counts&&sc.counts[f]!=null?+sc.counts[f]:+c.counts[f]||0),0);}return n;}
function keepWz(){if(!wz)return;let W=win(day,getDay().shift);if($('t1h'))wz.sm=rt('t1',W);if($('t2h'))wz.em=rt('t2',W);if($('desc'))wz.description=$('desc').value;if($('qc'))wz.concrete=$('qc').value===''?null:+$('qc').value;}
function bindStep(s){
 if(s===0){let pq=$('pq');const run=()=>{let toks=norm(pq.value).split(/\s+/).filter(Boolean);if(!toks.length){$('pres').innerHTML='';return;}let word=t=>new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)'),out=[];
   for(let p of catalog.pieces){if(!toks.every(t=>p.h.includes(t)))continue;let l=norm(p.l);out.push([-toks.filter(t=>word(t).test(l)).length*10-toks.filter(t=>l.includes(t)).length*3+(p.g?0:4)+l.length/200,p]);}
   out.sort((a,b)=>a[0]-b[0]);$('pres').innerHTML=out.slice(0,8).map(([,p],i)=>`<button type="button" class="res" role="option" data-u="${esc(p.u)}" aria-selected="${i===0}"><span class="k">${esc(p.k)}${p.t?' · T'+p.t:''}</span><span class="l">${esc(p.l)}</span><span class="a">${esc(place(p))}</span></button>`).join('')||'<p class="hint" style="padding:10px 12px;margin:0">Nada encontrado. Tente só o número: 23, AP05, A12.</p>';
   $('pres').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u));};
  pq.oninput=run;pq.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('pres').querySelector('[aria-selected=true]')?.click();}};
  document.querySelectorAll('.chips [data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u));setTimeout(()=>pq.focus(),80);}
 if(s===1)document.querySelectorAll('.svc').forEach(b=>b.onclick=()=>{wz.service=b.dataset.s;let st=svcState(wz.uid,wz.service);if(!wz.id)wz.status=st.k==='todo'?'Início':st.k==='done'?'':'Em andamento';wz.step=2;drawStep();});
 if(s===2)document.querySelectorAll('#status button').forEach(b=>b.onclick=()=>{keepWz();wz.status=b.dataset.v;drawStep();});
 if(s===3)bindCrewPicker(wz,()=>{if(wz){wz.step=3;drawStep();}});
 if(s===4){bindConcrete(wz,drawStep);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{keepWz();wz.step=+b.dataset.jump;drawStep();});
  $('del')&&($('del').onclick=()=>{let b=$('del');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Toque de novo para excluir';return;}let e=db.events.find(x=>x.id===wz.id);e.deleted=true;e.updated=new Date().toISOString();let x=getDay();x.stops=x.stops.filter(p=>p.act!=='e:'+e.id);x.photos=x.photos.filter(g=>g.act!=='e:'+e.id);refreshWorkers();save();closeSheet();note('Atividade excluída. A exclusão também vai para o 3D.');});}
}
function pick(u){wz.uid=u;if(!wz.id){wz.service='';wz.status='';}db.recent=[u,...db.recent.filter(x=>x!==u)].slice(0,8);save();wz.step=1;drawStep();}
function saveWizard(){
 let x=getDay(),p=pieceMap.get(wz.uid),alert=t=>{$('walert').innerHTML=`<p class="alert err">${esc(t)}</p>`;note(t,true);};
 if(!x.author)return alert('Informe o nome do apontador em 01 · Turno.');
 if(wz.hasC==null)return alert('Responda se teve concreto nesta atividade.');
 if(wz.hasC&&!(wz.concrete>0))return alert('Informe quantos m³ de concreto foram aplicados.');
 if(!wz.crews.length)return alert('Escolha pelo menos uma equipe.');
 if(live().some(e=>e.id!==wz.id&&e.date===day&&e.uid===wz.uid&&e.service===wz.service&&e.status===wz.status&&e.sm===wz.sm))return alert('Já existe esta mesma atividade neste horário. Abra a existente para corrigir.');
 let st=svcState(wz.uid,wz.service);if(wz.status==='Concluído'&&st.k==='done'&&!wz.id&&!wz.confirm){wz.confirm=true;return alert('Este serviço já consta concluído em '+br(st.d)+'. Toque em Salvar de novo para registrar mesmo assim.');}
 let now=new Date().toISOString();
 let ev={id:wz.id||uid(),date:day,author:x.author,device:db.device,uid:wz.uid,piece:p.l,service:wz.service,status:wz.status,sm:wz.sm,em:wz.em,startTime:hm(wz.sm),endTime:hm(wz.em,true),shift:x.shift,crews:wz.crews,teamName:'',workers:[],concrete:wz.hasC?+wz.concrete:null,steel:null,description:String(wz.description||'').trim(),front:x.front,created:now,updated:now};
 if(wz.id){let i=db.events.findIndex(e=>e.id===wz.id);ev.created=db.events[i].created;db.events[i]=ev;}else db.events.push(ev);
 refreshWorkers();touch(day);let edit=!!wz.id,keep={sm:wz.sm,em:wz.em,crews:wz.crews};save();
 if(edit){closeSheet();return note('Correção salva.');}
 sheet('Atividade salva',p.l+' · '+svcLabel(ev.service));
 $('sh-body').innerHTML=`<p class="q">✓ Atividade salva</p><div class="sum"><span>Peça</span><b>${esc(p.l)}</b><span>Serviço</span><b>${esc(svcLabel(ev.service))} · ${esc(ev.status)}</b><span>Horário</span><b>${span(ev.sm,ev.em)}</b></div><p class="hint" style="margin-top:14px">A mesma equipe fez outra atividade? Lance já, aproveitando equipe e horário.</p>`;
 $('sh-foot').innerHTML=`<button class="btn" type="button" id="done">Concluir</button><button class="btn primary" type="button" id="again">+ Outra com esta equipe</button>`;
 $('done').onclick=()=>{closeSheet();note('Atividade salva.');};$('again').onclick=()=>openWizard(null,keep);wz={step:-1};
}

// ---------- Atividade extra ----------
function openExtra(t){let x=getDay(),w=win(day,x.shift);
 let st=t?{id:t.id,desc:t.desc,sm:t.sm,em:t.em,crews:structuredClone(t.crews||[]),hasC:t.concrete!=null,concrete:t.concrete,obs:t.obs||''}:{desc:'',sm:w.a,em:w.b,crews:[],hasC:null,concrete:null,obs:''};wz=st;
 const draw=()=>{sheet(t?'Corrigir atividade extra':'Atividade extra','Fora do escopo do 3D · '+br(day));
  $('sh-body').innerHTML=`<p class="q">O que foi feito?</p><label class="f">Descrição da atividade<input id="xd" value="${esc(st.desc)}" placeholder="Ex.: Limpeza do canteiro, apoio à topografia" maxlength="120"></label>
  ${db.extrasLib.length?`<div class="chips" id="xlib">${db.extrasLib.slice(0,12).map(s=>`<button type="button" data-x="${esc(s)}" aria-pressed="${s===st.desc}">${esc(s)}</button>`).join('')}</div>`:''}
  <h3>Horário</h3><div class="grid2"><label class="f">Começou às${tp('t1',w,st.sm)}</label><label class="f">Terminou às${tp('t2',w,st.em)}</label></div>
  <h3>Equipes</h3>${crewPicker(st)}
  ${concreteBlock(st)}
  <label class="f" style="margin-top:12px">Observação (opcional)<textarea id="xo">${esc(st.obs)}</textarea></label><div id="walert"></div>`;
  $('sh-foot').innerHTML=`${t?'<button class="btn danger" type="button" id="xdel">Excluir</button>':'<button class="btn" type="button" id="xcancel">Cancelar</button>'}<button class="btn primary" type="button" id="xsave">${t?'Salvar correção':'Salvar atividade'}</button>`;
  const keepX=()=>{st.desc=$('xd').value.trim();st.sm=rt('t1',w);st.em=rt('t2',w);st.obs=$('xo').value;if($('qc'))st.concrete=$('qc').value===''?null:+$('qc').value;};
  ['xd','t1h','t1m','t2h','t2m','xo'].forEach(id=>$(id).onchange=keepX);
  document.querySelectorAll('#xlib [data-x]').forEach(b=>b.onclick=()=>{keepX();st.desc=b.dataset.x;draw();});
  bindCrewPicker(st,()=>{if($('xd'))keepX();draw();});
  document.querySelectorAll('#hasC button').forEach(b=>b.onclick=()=>{keepX();st.hasC=b.dataset.v==='1';if(!st.hasC)st.concrete=null;draw();});
  $('xcancel')&&($('xcancel').onclick=closeSheet);
  $('xdel')&&($('xdel').onclick=()=>{let b=$('xdel');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar exclusão';return;}x.extras=x.extras.filter(k=>k.id!==t.id);x.stops=x.stops.filter(p=>p.act!=='x:'+t.id);x.photos=x.photos.filter(g=>g.act!=='x:'+t.id);refreshWorkers();touch(day);save();closeSheet();note('Atividade extra excluída.');});
  $('xsave').onclick=()=>{keepX();let al=m=>{$('walert').innerHTML=`<p class="alert err">${esc(m)}</p>`;note(m,true);};
   if(!x.author)return al('Informe o nome do apontador em 01 · Turno.');if(st.desc.length<3)return al('Descreva a atividade.');if(st.em<=st.sm)return al('O fim precisa ser depois do início.');if(!st.crews.length)return al('Escolha pelo menos uma equipe.');if(st.hasC==null)return al('Responda se teve concreto.');if(st.hasC&&!(st.concrete>0))return al('Informe os m³ de concreto.');
   let now=new Date().toISOString(),rec={id:st.id||uid(),desc:st.desc,sm:st.sm,em:st.em,crews:st.crews,concrete:st.hasC?+st.concrete:null,obs:st.obs.trim(),created:t?.created||now,updated:now};
   if(t){let i=x.extras.findIndex(k=>k.id===t.id);x.extras[i]=rec;}else x.extras.push(rec);
   db.extrasLib=[st.desc,...db.extrasLib.filter(s=>norm(s)!==norm(st.desc))].slice(0,30);refreshWorkers();touch(day);save();closeSheet();note(t?'Correção salva.':'Atividade extra salva.');};};
 draw();}

// ---------- Paralisação ----------
function openStop(p){let x=getDay(),w=win(day,x.shift),acts=listActs();
 let st=p?{...p}:{act:acts[0]?.key||'',crew:'all',sm:acts[0]?.sm??w.a,em:Math.min((acts[0]?.sm??w.a)+60,w.b),type:'',desc:''};
 const draw=()=>{let a=acts.find(k=>k.key===st.act),crs=(a?.crews||[]).map(c=>x.crews.find(k=>k.id===c.id)).filter(Boolean);if(st.crew!=='all'&&!crs.some(c=>c.id===st.crew))st.crew='all';
  sheet(p?'Corrigir paralisação':'Paralisação',br(day)+' · '+(x.author||''));
  $('sh-body').innerHTML=`<p class="q">Qual atividade parou?</p><label class="f">Atividade<select id="pa">${acts.map(k=>`<option value="${k.key}" ${k.key===st.act?'selected':''}>${esc(actName(k))} · ${span(k.sm,k.em)}</option>`).join('')}</select></label>
  <label class="f" style="margin-top:10px">Equipe parada<select id="pc"><option value="all">Todas as equipes da atividade</option>${crs.map(c=>`<option value="${c.id}" ${c.id===st.crew?'selected':''}>${esc(title(c.fid))} · ${crewTotal(c)} pessoas</option>`).join('')}</select></label>
  <h3>Horário da paralisação</h3><div class="grid2"><label class="f">Início${tp('ps',w,st.sm)}</label><label class="f">Fim${tp('pe',w,st.em)}</label></div>
  <h3>Motivo</h3><label class="f">Tipo do motivo<select id="pt"><option value="">Selecione…</option>${MOTIVOS.map(m=>`<option ${m===st.type?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
  <label class="f" style="margin-top:10px">Descreva o motivo<textarea id="pd" placeholder="O que aconteceu e o que faltou para continuar">${esc(st.desc)}</textarea></label><div id="walert"></div>`;
  $('sh-foot').innerHTML=`${p?'<button class="btn danger" type="button" id="pdel">Excluir</button>':'<button class="btn" type="button" id="pcancel">Cancelar</button>'}<button class="btn primary" type="button" id="psave">${p?'Salvar correção':'Salvar paralisação'}</button>`;
  const keepP=()=>{st.act=$('pa').value;st.crew=$('pc').value;st.sm=rt('ps',w);st.em=rt('pe',w);st.type=$('pt').value;st.desc=$('pd').value;};
  $('pa').onchange=()=>{keepP();draw();};['pc','psh','psm','peh','pem','pt','pd'].forEach(id=>$(id).onchange=keepP);
  $('pcancel')&&($('pcancel').onclick=closeSheet);
  $('pdel')&&($('pdel').onclick=()=>{let b=$('pdel');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar exclusão';return;}x.stops=x.stops.filter(k=>k.id!==p.id);touch(day);save();closeSheet();note('Paralisação excluída.');});
  $('psave').onclick=()=>{keepP();let al=m=>{$('walert').innerHTML=`<p class="alert err">${esc(m)}</p>`;note(m,true);};
   if(!st.act)return al('Escolha a atividade.');if(st.em<=st.sm)return al('O fim precisa ser depois do início.');if(!st.type)return al('Escolha o tipo do motivo.');if(String(st.desc).trim().length<3)return al('Descreva o motivo da paralisação.');

  <label class="f" style="margin-top:10px">Encarregado<select id="fc">${crs.map(c=>`<option value="${c.id}" ${c.id===st.crew?'selected':''}>${esc(title(c.fid))}</option>`).join('')||'<option value="">Sem equipe nesta atividade</option>'}</select></label>

  ${left>0?`<div class="ph" style="margin-top:10px"><label>${ICON.cam}<span>Câmera</span><input type="file" accept="image/*" capture="environment" data-add></label><label>${ICON.img}<span>Galeria</span><input type="file" accept="image/*" multiple data-add></label></div>`:'<p class="hint">Limite de 6 fotos nesta atividade.</p>'}<div id="walert"></div>`;
  $('sh-foot').innerHTML=`${g?'<button class="btn danger" type="button" id="gdel">Excluir</button>':'<button class="btn" type="button" id="gcancel">Cancelar</button>'}<button class="btn primary" type="button" id="gsave">Salvar fotos</button>`;

  document.querySelectorAll('[data-add]').forEach(inp=>inp.onchange=async()=>{if(busy)return;busy=true;let fs=[...inp.files].slice(0,6-used(st.act)-st.items.length),a2=acts.find(k=>k.key===st.act);if([...inp.files].length>fs.length)note('Só cabem mais '+fs.length+' foto(s) nesta atividade.');else note('Preparando '+fs.length+' foto(s)…');
   try{for(let f of fs){let blob=await shrink(f,`${a2?a2.label:''} · ${br(day)} ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${x.author||''}`,1100,.68),id='foto-'+day+'-'+uid();if(!(await putPhoto(id,blob)))throw Error('sem espaço no aparelho');st.items.push(id);}}catch(e){note('Não foi possível salvar a foto: '+e.message,true);}busy=false;draw();});
  $('gcancel')&&($('gcancel').onclick=closeSheet);
  $('gdel')&&($('gdel').onclick=()=>{let b=$('gdel');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar exclusão';return;}x.photos=x.photos.filter(p=>p.id!==g.id);touch(day);save();closeSheet();note('Fotos removidas do RDO.');});
  $('gsave').onclick=()=>{if(!st.act)return note('Escolha a atividade.',true);if(!st.items.length){$('walert').innerHTML='<p class="alert err">Adicione pelo menos uma foto.</p>';return;}
